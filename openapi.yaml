      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, DEPARTMENT_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, REVIEWER, SECTOR_OFFICER, FINANCE_OFFICER, SUBMITTER, OBSERVER]
      summary: List timetable blocks that overlap a time window
      description: |
        `from` and `to` are required by the service even though they are optional at binding time;
        `to` must be after `from`, otherwise the call returns `422`. Blocks are ordered by start time
        and optionally filtered by facility.
      parameters:
        - name: facility_id
          in: query
          required: false
          description: Optional facility id filter.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          description: Start of the overlap window, ISO-8601 date-time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End of the overlap window, ISO-8601 date-time. Must be after `from`.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The overlapping timetable blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimetableBlock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Operations]
      operationId: createTimetableBlock
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, DEPARTMENT_COORDINATOR]
      summary: Create one or more timetable blocks
      description: |
        `ends_at` must be after `starts_at`. When both `recurrence_rule` and `recurrence_until` are
        supplied, weekly occurrences are generated in Africa/Kampala up to 52 times; otherwise a
        single block is created. Blank department, source and recurrence strings are normalised to
        null. Each occurrence receives its own id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimetableBlockRequest'
      responses:
        '201':
          description: The created timetable block or blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimetableBlock'
