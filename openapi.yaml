    SubmissionStage:
      type: string
      description: |
        Canonical brief lifecycle. `RECEIVED`, `REGISTERED`, and `REJECTED` are
        retired; rejection now closes the brief as `CLOSED`.
      enum: [DRAFT, SUBMITTED, AWAITING_INFORMATION, FORWARDED, IN_FACT_FINDING, READY_FOR_REVIEW, IN_REVIEW, IMPROVEMENT_REQUESTED, RESUBMITTED, CONFIRMED_AS_PROJECT, AWAITING_PAYMENT, IN_PROGRESS, COMPLETED, CLOSED]
    CaseStage:
      type: string
      description: |
        Canonical case-file stage. The case-file stepper groups
        `AWAITING_INFORMATION` under `SUBMITTED`, `RESUBMITTED` under `IN_REVIEW`,
        `AWAITING_PAYMENT` under `CONFIRMED_AS_PROJECT`, and `CLOSED` under
        `COMPLETED`; `DRAFT` has no stepper step.
      enum: [DRAFT, SUBMITTED, AWAITING_INFORMATION, FORWARDED, IN_FACT_FINDING, READY_FOR_REVIEW, IN_REVIEW, IMPROVEMENT_REQUESTED, RESUBMITTED, CONFIRMED_AS_PROJECT, AWAITING_PAYMENT, IN_PROGRESS, COMPLETED, CLOSED]
    OutcomeStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, DECIDED]
    DocumentStatus:
      type: string
      enum: [REQUIRED, OPTIONAL, MISSING, VERIFIED, SUBMITTED, ONE_FILE, NOT_REQUIRED]
      description: |
        Intake states are `REQUIRED`, `OPTIONAL`, and `MISSING`; `VERIFIED`,
        `SUBMITTED`, `ONE_FILE`, and `NOT_REQUIRED` are retained for the case
        file review workflow.
    DocumentType:
      type: string
      enum: [PROJECT_BRIEF, RECOMMENDATION_LETTER, SUPPORTING_EVIDENCE, OTHER]
