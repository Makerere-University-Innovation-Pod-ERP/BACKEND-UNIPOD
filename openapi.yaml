openapi: 3.1.0
info:
  title: Makerere Innovation Hub ERP API
  version: 1.0.0
  description: |
    Waluube intake and case workflow contract. A submission receives its
    tracking reference when it is created, remains a draft while information
    is being completed, and can be registered and forwarded to a sector.
    Student evidence is required before registration; general-public cases
    must not include student-specific fields.
servers:
  - url: https://backend-unipod.onrender.com/api
    description: Production API on Render
  - url: /api
    description: API context path for local development
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Login and administrator-only account provisioning
  - name: Submissions
    description: Intake and registration
  - name: Reception
    description: Reception work queue
  - name: Dashboard
    description: Pipeline overview metrics
  - name: Sectors
    description: Sector catalog and routing
  - name: Case Files
    description: W4 case file aggregate, controls, stages, outcome, and document review
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Exchange administrator-provisioned credentials for a bearer token
      description: Public account registration is disabled. Login failures return the same response for unknown, disabled, or invalid credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Short-lived bearer access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/users:
    post:
      tags: [Authentication]
      operationId: createApiUser
      summary: Create an account with an application role
      description: Administrator only. The password is never returned; public signup is not available.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiUserRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An account with this email already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      summary: Create an intake draft
      description: |
        Available to Administrator, Innovation Coordinator, Receptionist,
        Fact-Finding Officer, and Submitter. A Submitter's identity is taken
        from the authenticated principal; a supplied submitterId cannot change
        ownership. Intake staff may create walk-in submissions for another
        submitter. A unique case code is allocated atomically at creation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
            examples:
              student:
                value:
                  category: student
                  title: Low-cost irrigation monitor
                  purpose: Prototype a low-cost monitor for small farms
                  problemAddressed: Farmers lack timely soil-moisture information
                  studentNumber: "2026001234"
                  programme: Agricultural Engineering
                  supervisor: Dr Example
                  recommendationLetterStatus: submitted
              general:
                value:
                  category: general
                  title: Community solar charging point
                  purpose: Explore a shared charging point
                  problemAddressed: Limited access to reliable charging
                  submitterId: submitter@example.test
                  submitterEmail: submitter@example.test
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Submissions]
      operationId: listSubmissions
      summary: List all submissions
      description: Results are role-scoped, filtered, paginated, and stably ordered by received date then id.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: category
          in: query
          schema:
            type: string
            enum: [student, general]
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/SubmissionStage'
        - name: sector
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Case-insensitive title substring.
          schema:
            type: string
      responses:
        '200':
          description: A page of submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/search:
    get:
      tags: [Submissions]
      operationId: searchSubmissions
      summary: Search submissions by exact code or title
      description: Exact case-code matches are returned first; otherwise code is treated as a title substring.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Matching submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/mine:
    get:
      tags: [Submissions]
      operationId: listMySubmissions
      summary: List submissions created by the authenticated user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of the caller's submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/submissions:
    get:
      tags: [Submissions]
      operationId: listMySubmitterSubmissions
      summary: List cases linked to the authenticated submitter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Submitter-owned submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitterSubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/capabilities:
    get:
      tags: [Submissions]
      operationId: getSubmitterCapabilities
      summary: Return submitter navigation capabilities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Locked modules and registration capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitterCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/{id}/register:
    post:
      tags: [Submissions]
      operationId: registerSubmission
      summary: Register a submission as received
      description: |
        Available to Administrator, Innovation Coordinator, Receptionist, and
        Fact-Finding Officer. Preserves the code assigned at creation.
        Student number, programme, supervisor, and recommendation-letter status must be present for
        student submissions. A submission can be registered only once.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Submission registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/request-information:
    post:
      tags: [Submissions]
      operationId: requestSubmissionInformation
      summary: Ask a submitter to complete or correct a draft
      description: Intake roles can attach a required-information note to a draft with a known submitter email. A missing email returns 400. The change and notification outbox event are committed together.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInformationRequest'
      responses:
        '200':
          description: Draft with the information request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/reviewer:
    put:
      tags: [Submissions]
      operationId: assignSubmissionReviewer
      summary: Assign or clear a reviewer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentRequest'
      responses:
        '200':
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /submissions/{id}:
    get:
      tags: [Submissions]
      operationId: getCaseFile
      summary: Get the case file, documents, and stage history
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Case file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Submissions]
      operationId: updateSubmissionDraft
      summary: Update an owned draft
      description: Submitters can update only their own drafts; intake roles can update drafts they manage. Updating a draft clears its outstanding information request. The tracking reference and submitter ownership remain unchanged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /cases/{id}:
    get:
      tags: [Case Files]
      operationId: getCaseFileAggregate
      summary: Get the W4 case file aggregate
      description: |
        Available to Administrator, Innovation Coordinator, Fact-Finding
        Officer, Reviewer, Sector Officer, IP Liaison, Submitter, and Observer.
        Reviewer and Sector Officer results are row-scoped. Mark's reviewer
        panel/quorum and David's activity are marked NOT_CONFIGURED until their
        integration providers are supplied.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Case aggregate for the case file screen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseFileAggregate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cases/{id}/capabilities:
    get:
      tags: [Case Files]
      operationId: getCaseFileCapabilities
      summary: Get enabled state and reason for each case-file control
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Per-control capability state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseFileCapabilities'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cases/{id}/transitions/allowed:
    get:
      tags: [Case Files]
      operationId: getAllowedCaseTransitions
      summary: Get valid next case stages for the actor
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Empty for read-only roles or terminal stages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedCaseTransitions'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cases/{id}/transitions:
    post:
      tags: [Case Files]
      operationId: transitionCase
      summary: Move a case to its next allowed stage
      description: Only Administrator and Innovation Coordinator may transition cases. Leaving Fact-Finding is coordinator-controlled. The current version is required to reject stale writes.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseTransitionRequest'
      responses:
        '200':
          description: Updated case aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseFileAggregate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /cases/{id}/outcome:
    put:
      tags: [Case Files]
      operationId: saveCaseOutcome
      summary: Save case outcome
      description: Only Administrator and Innovation Coordinator may save outcomes. Save is rejected with 409 until Mark's configured reviewer quorum is available and met.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomeUpdateRequest'
      responses:
        '200':
          description: Updated case aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseFileAggregate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /cases/{id}/documents/{documentId}:
    patch:
      tags: [Case Files]
      operationId: updateCaseDocumentStatus
      summary: Update document verification status
      description: Only Administrator and Innovation Coordinator may update status. Include the current case version.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentStatusUpdateRequest'
      responses:
        '200':
          description: Updated case aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseFileAggregate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/forward:
    post:
      tags: [Submissions]
      operationId: forwardSubmission
      summary: Register and forward a draft, or forward a received submission
      description: A draft is registered and forwarded in one transaction. Stores the sector assignment, stage history, and durable submission.forwarded outbox event in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardSubmissionRequest'
      responses:
        '200':
          description: Submission forwarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/transition:
    post:
      tags: [Submissions]
      operationId: advanceSubmission
      summary: Advance a forwarded submission through the pipeline
      description: Only FORWARDED to IN_PROGRESS and IN_PROGRESS to COMPLETED are allowed. Backward transitions and skipped stages are rejected.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceSubmissionRequest'
      responses:
        '200':
          description: Submission advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/documents:
    post:
      tags: [Submissions]
      operationId: addSubmissionDocument
      summary: Add document metadata to a case
      description: Accepts an opaque storage reference, not a URL, filesystem path, or file bytes. File storage is provided by an external storage integration.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document metadata created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/documents/upload:
    post:
      tags: [Submissions]
      operationId: uploadSubmissionDocument
      summary: Upload a document to configured S3-compatible storage
      description: Available only when S3 storage is enabled. Files are limited by the configured server-side upload limit.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, status, file]
              properties:
                name:
                  type: string
                  maxLength: 255
                status:
                  $ref: '#/components/schemas/DocumentStatus'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document metadata and generated opaque storage reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: Uploaded file exceeds the configured size limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /submissions/{id}/documents/{documentId}/file:
    get:
      tags: [Submissions]
      operationId: downloadSubmissionDocument
      summary: Download a case document
      description: The response is always an attachment with an octet-stream content type and nosniff protection.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document bytes
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /sectors:
    get:
      tags: [Sectors]
      operationId: listActiveSectors
      summary: List active sectors
      responses:
        '200':
          description: Active sectors ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sector'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Sectors]
      operationId: createSector
      summary: Create a sector
      description: Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorRequest'
      responses:
        '201':
          description: Sector created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sector'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /sectors/catalog:
    get:
      tags: [Sectors]
      operationId: listAllSectors
      summary: List active and inactive sectors
      description: Administrator only; use this list to reactivate a deactivated sector.
      responses:
        '200':
          description: All sectors ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sector'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sectors/filter-options:
    get:
      tags: [Sectors]
      operationId: listSectorFilterOptions
      summary: List sector names for submission filters
      description: Returns only sector IDs and names to roles permitted to read submissions.
      responses:
        '200':
          description: Sectors ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SectorFilterOption'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sectors/{id}:
    put:
      tags: [Sectors]
      operationId: updateSector
      summary: Update or deactivate a sector
      description: Administrator only. Deactivation is soft; existing cases retain their sector reference.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorRequest'
      responses:
        '200':
          description: Updated sector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sector'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sectors/{id}/members:
    get:
      tags: [Sectors]
      operationId: listSectorMembers
      summary: List sector officer subjects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sector officer subject identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Sectors]
      operationId: addSectorMember
      summary: Add a sector officer subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorMemberRequest'
      responses:
        '200':
          description: Added subject identifier
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sectors]
      operationId: removeSectorMember
      summary: Remove a sector officer subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subject
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /queues/reception:
    get:
      tags: [Reception]
      operationId: getReceptionQueue
      summary: Get draft reception queue and queue counters
      description: The queue contains DRAFT submissions. Awaiting action counts RECEIVED submissions; recently updated counts all submissions updated in the last 14 days.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Reception queue page and counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionQueue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dashboard/overview:
    get:
      tags: [Dashboard]
      operationId: getDashboardOverview
      summary: Get the role-scoped dashboard composed from workflow and module summaries
      description: Available to every authenticated role. Operational tiles are visible to all roles; finance data is returned only to Administrators and Innovation Coordinators. Results are cached for 30 seconds. Unconfigured external modules identify their availability rather than returning fabricated metrics.
      responses:
        '200':
          description: Waluube workflow metrics, attention items, and role-visible module tiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SubmissionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 128
    LoginResponse:
      type: object
      required: [tokenType, accessToken, expiresAt]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    CreateApiUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        role:
          $ref: '#/components/schemas/ApiUserRole'
    ApiUser:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/ApiUserRole'
        createdAt:
          type: string
          format: date-time
    ApiUserRole:
      type: string
      enum:
        - ADMINISTRATOR
        - INNOVATION_COORDINATOR
        - RECEPTIONIST
        - FACT_FINDING_OFFICER
        - REVIEWER
        - SECTOR_OFFICER
        - IP_LIAISON
        - SUBMITTER
        - OBSERVER
    CreateSubmissionRequest:
      type: object
      additionalProperties: false
      required: [category, title, purpose, problemAddressed]
      properties:
        category:
          type: string
          enum: [student, general]
        title:
          type: string
          minLength: 1
          maxLength: 240
        purpose:
          type: string
          minLength: 1
          maxLength: 5000
        problemAddressed:
          type: string
          minLength: 1
          maxLength: 5000
        submitterId:
          type: [string, 'null']
          maxLength: 255
        submitterEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        studentNumber:
          type: string
          maxLength: 80
        programme:
          type: string
          maxLength: 200
        supervisor:
          type: string
          maxLength: 255
        recommendationLetterStatus:
          $ref: '#/components/schemas/RecommendationLetterStatus'
      allOf:
        - if:
            properties:
              category:
                const: general
          then:
            not:
              anyOf:
                - required: [studentNumber]
                - required: [programme]
                - required: [supervisor]
                - required: [recommendationLetterStatus]
    RequestInformationRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
    RecommendationLetterStatus:
      type: string
      enum: [verified, submitted, one_file, not_required]
    SubmissionStage:
      type: string
      enum: [DRAFT, RECEIVED, REGISTERED, FACT_FINDING, UNDER_REVIEW, REFINEMENT_REQUESTED, FURTHER_HANDLING, FORWARDED, IN_PROGRESS, COMPLETED]
    CaseStage:
      type: string
      enum: [RECEIVED, REGISTERED, FACT_FINDING, UNDER_REVIEW, REFINEMENT_REQUESTED, FURTHER_HANDLING, COMPLETED]
    OutcomeStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, DECIDED]
    DocumentStatus:
      type: string
      enum: [VERIFIED, SUBMITTED, ONE_FILE, NOT_REQUIRED]
    DocumentType:
      type: string
      enum: [PROJECT_BRIEF, RECOMMENDATION_LETTER, SUPPORTING_EVIDENCE, OTHER]
    ForwardSubmissionRequest:
      type: object
      additionalProperties: false
      required: [sectorId]
      properties:
        sectorId:
          type: string
          format: uuid
    AdvanceSubmissionRequest:
      type: object
      additionalProperties: false
      required: [stage]
      properties:
        stage:
          type: string
          enum: [IN_PROGRESS, COMPLETED]
    CreateDocumentRequest:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        documentType:
          $ref: '#/components/schemas/DocumentType'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileReference:
          type: [string, 'null']
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
    SubmissionDocument:
      type: object
      required: [id, submissionId, name, documentType, status, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        name:
          type: string
        documentType:
          $ref: '#/components/schemas/DocumentType'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileReference:
          type: [string, 'null']
        contentType:
          type: [string, 'null']
        fileSize:
          type: [integer, 'null']
          format: int64
        originalFilename:
          type: [string, 'null']
          maxLength: 255
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    SectorRequest:
      type: object
      additionalProperties: false
      required: [name, notificationEmail, active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        notificationEmail:
          type: string
          format: email
          maxLength: 320
        active:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
          description: Expected sector version for updates; omit when creating a sector.
    Sector:
      allOf:
        - $ref: '#/components/schemas/SectorRequest'
        - type: object
          required: [id, version, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    SectorFilterOption:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ReviewerAssignmentRequest:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: [string, 'null']
          maxLength: 255
    SectorMemberRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
    SubmissionPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Submission'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    SubmitterSubmissionPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmitterSubmission'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    SubmitterSubmission:
      type: object
      required: [id, category, title, purpose, problemAddressed, stage, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: [string, 'null']
        category:
          type: string
          enum: [student, general]
        title:
          type: string
        purpose:
          type: string
        problemAddressed:
          type: string
        studentNumber:
          type: [string, 'null']
        programme:
          type: [string, 'null']
        supervisor:
          type: [string, 'null']
        recommendationLetterStatus:
          anyOf:
            - $ref: '#/components/schemas/RecommendationLetterStatus'
            - type: 'null'
        stage:
          $ref: '#/components/schemas/SubmissionStage'
        receivedAt:
          type: [string, 'null']
          format: date-time
        forwardedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReceptionQueue:
      allOf:
        - $ref: '#/components/schemas/SubmissionPage'
        - type: object
          required: [inQueueCount, awaitingActionCount, recentlyUpdatedCount]
          properties:
            inQueueCount:
              type: integer
              format: int64
            awaitingActionCount:
              type: integer
              format: int64
            recentlyUpdatedCount:
              type: integer
              format: int64
    CaseStageHistory:
      type: object
      required: [id, toStage, changedBy, note, changedAt]
      properties:
        id:
          type: string
          format: uuid
        fromStage:
          oneOf:
            - $ref: '#/components/schemas/SubmissionStage'
            - type: 'null'
        toStage:
          $ref: '#/components/schemas/SubmissionStage'
        changedBy:
          type: string
        note:
          type: [string, 'null']
        changedAt:
          type: string
          format: date-time
    CaseFile:
      type: object
      required: [submission, documents, stageHistory]
      properties:
        submission:
          $ref: '#/components/schemas/Submission'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionDocument'
        stageHistory:
          type: array
          items:
            $ref: '#/components/schemas/CaseStageHistory'
    CaseFileAggregate:
      type: object
      required: [submission, currentStage, reference, documents, stageHistory, stepper, outcome, capabilities, transitionOptions, reviewPanel, activity]
      properties:
        submission:
          $ref: '#/components/schemas/Submission'
        currentStage:
          oneOf:
            - $ref: '#/components/schemas/CaseStage'
            - type: 'null'
        reference:
          type: [string, 'null']
        documents:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionDocument'
        stageHistory:
          type: array
          items:
            $ref: '#/components/schemas/CaseStageHistory'
        stepper:
          type: array
          items:
            $ref: '#/components/schemas/CaseStepperItem'
        outcome:
          $ref: '#/components/schemas/CaseOutcome'
        capabilities:
          $ref: '#/components/schemas/CaseFileCapabilities'
        transitionOptions:
          $ref: '#/components/schemas/AllowedCaseTransitions'
        reviewPanel:
          $ref: '#/components/schemas/CaseReviewPanel'
        activity:
          $ref: '#/components/schemas/CaseActivity'
    CaseStepperItem:
      type: object
      required: [stage, state]
      properties:
        stage:
          $ref: '#/components/schemas/CaseStage'
        state:
          type: string
          enum: [UPCOMING, CURRENT, COMPLETE]
    CaseOutcome:
      type: object
      required: [status, decision, note, decidedBy, decidedAt]
      properties:
        status:
          $ref: '#/components/schemas/OutcomeStatus'
        decision:
          type: [string, 'null']
        note:
          type: [string, 'null']
        decidedBy:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time
    CaseFileCapabilities:
      type: object
      required: [nextStep, saveOutcome, updateDocumentStatus]
      properties:
        nextStep:
          $ref: '#/components/schemas/Capability'
        saveOutcome:
          $ref: '#/components/schemas/Capability'
        updateDocumentStatus:
          $ref: '#/components/schemas/Capability'
    Capability:
      type: object
      required: [enabled, reason]
      properties:
        enabled:
          type: boolean
        reason:
          type: [string, 'null']
    AllowedCaseTransitions:
      type: object
      required: [allowedTransitions]
      properties:
        allowedTransitions:
          type: array
          items:
            $ref: '#/components/schemas/CaseStage'
    CaseReviewPanel:
      type: object
      required: [availability, reviewerTeam, ipPanel, quorumAvailable, quorumMet]
      properties:
        availability:
          type: string
          enum: [AVAILABLE, NOT_CONFIGURED]
        reviewerTeam:
          type: array
          items:
            type: string
        ipPanel:
          type: array
          items:
            type: string
        quorumAvailable:
          type: boolean
        quorumMet:
          type: boolean
    CaseActivity:
      type: object
      required: [availability, items]
      properties:
        availability:
          type: string
          enum: [AVAILABLE, NOT_CONFIGURED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaseActivityItem'
    CaseActivityItem:
      type: object
      required: [occurredAt, actor, action, summary]
      properties:
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        summary:
          type: string
    CaseTransitionRequest:
      type: object
      additionalProperties: false
      required: [to_stage, version]
      properties:
        to_stage:
          $ref: '#/components/schemas/CaseStage'
        note:
          type: [string, 'null']
          maxLength: 2000
        version:
          type: integer
          format: int64
          minimum: 0
    OutcomeUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        decision:
          type: [string, 'null']
          maxLength: 120
        note:
          type: [string, 'null']
          maxLength: 5000
        version:
          type: integer
          format: int64
          minimum: 0
    DocumentStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatus'
        documentType:
          $ref: '#/components/schemas/DocumentType'
        version:
          type: integer
          format: int64
          minimum: 0
    DashboardOverview:
      type: object
      required: [totalSubmissions, byStage, studentSubmissions, generalSubmissions, awaitingActionCount, forwardedCount, completedCount, recentlyUpdatedCount, awaitingReviewCount, refinementRequestedCount, pipelineAtAGlance, needsAttention, operations, finance, recentActivity]
      properties:
        totalSubmissions:
          type: integer
          format: int64
        byStage:
          type: object
          additionalProperties:
            type: integer
            format: int64
        studentSubmissions:
          type: integer
          format: int64
        generalSubmissions:
          type: integer
          format: int64
        awaitingActionCount:
          type: integer
          format: int64
        forwardedCount:
          type: integer
          format: int64
        completedCount:
          type: integer
          format: int64
        recentlyUpdatedCount:
          type: integer
          format: int64
        awaitingReviewCount:
          type: integer
          format: int64
          description: Fact-Finding and FORWARDED cases visible to the caller
        refinementRequestedCount:
          type: integer
          format: int64
        pipelineAtAGlance:
          type: object
          description: Six grouped lifecycle counts; intake combines RECEIVED and REGISTERED, Fact-Finding combines FACT_FINDING and FORWARDED, and review combines UNDER_REVIEW and IN_PROGRESS.
          additionalProperties:
            type: integer
            format: int64
        needsAttention:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardAttentionCase'
        operations:
          $ref: '#/components/schemas/DashboardOperations'
        finance:
          oneOf:
            - $ref: '#/components/schemas/DashboardFinance'
            - type: 'null'
          description: Present only for Administrators and Innovation Coordinators.
        recentActivity:
          $ref: '#/components/schemas/DashboardActivityFeed'
    DashboardAttentionCase:
      type: object
      required: [id, title, stage, reason, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: [string, 'null']
        title:
          type: string
        stage:
          $ref: '#/components/schemas/SubmissionStage'
        reason:
          type: string
        updatedAt:
          type: string
          format: date-time
    DashboardOperations:
      type: object
      required: [availability, reason, equipmentUnderRepair, bookingsToday, facilitiesFreeNow]
      properties:
        availability:
          type: string
          enum: [AVAILABLE, NOT_CONFIGURED]
        reason:
          type: [string, 'null']
        equipmentUnderRepair:
          type: [integer, 'null']
          format: int64
        bookingsToday:
          type: [integer, 'null']
          format: int64
        facilitiesFreeNow:
          type: [integer, 'null']
          format: int64
    DashboardFinance:
      type: object
      required: [availability, reason, incomeMonthToDate, incomeBars]
      properties:
        availability:
          type: string
          enum: [AVAILABLE, NOT_CONFIGURED]
        reason:
          type: [string, 'null']
        incomeMonthToDate:
          type: [number, 'null']
          format: double
        incomeBars:
          type: array
          items:
            $ref: '#/components/schemas/DashboardIncomeBar'
    DashboardIncomeBar:
      type: object
      required: [period, income]
      properties:
        period:
          type: string
        income:
          type: number
          format: double
    DashboardActivityFeed:
      type: object
      required: [availability, reason, items]
      properties:
        availability:
          type: string
          enum: [AVAILABLE, NOT_CONFIGURED]
        reason:
          type: [string, 'null']
        items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardActivity'
    DashboardActivity:
      type: object
      required: [occurredAt, actor, action, summary]
      properties:
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        summary:
          type: string
    Submission:
      type: object
      required: [id, category, title, purpose, problemAddressed, registeredBy, stage, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: [string, 'null']
          pattern: '^(STU|GEN)-[0-9]{4}-[0-9]{6,19}$'
        category:
          type: string
          enum: [student, general]
        title:
          type: string
        purpose:
          type: string
        problemAddressed:
          type: string
        registeredBy:
          type: string
        submitterId:
          type: string
        receivingOfficer:
          type: [string, 'null']
        assignedReviewerSubject:
          type: [string, 'null']
        studentNumber:
          type: [string, 'null']
        programme:
          type: [string, 'null']
        supervisor:
          type: [string, 'null']
        recommendationLetterStatus:
          oneOf:
            - $ref: '#/components/schemas/RecommendationLetterStatus'
            - type: 'null'
        responsibleSectorId:
          type: [string, 'null']
          format: uuid
        responsibleSectorName:
          type: [string, 'null']
        stage:
          $ref: '#/components/schemas/SubmissionStage'
        receivedAt:
          type: [string, 'null']
          format: date-time
        forwardedAt:
          type: [string, 'null']
          format: date-time
        informationRequestedNote:
          type: [string, 'null']
        informationRequestedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    SubmitterCapabilities:
      type: object
      required: [canRegisterSubmission, registrationMessage, lockedModules]
      properties:
        canRegisterSubmission:
          type: boolean
        registrationMessage:
          type: string
        lockedModules:
          type: array
          items:
            type: string
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        reference:
          type: string
          description: Support reference included for unexpected server errors.
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: A valid bearer token is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated user lacks an allowed intake role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Submission does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Submission has already been registered
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error. The response includes a support reference but no internal details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
