components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SubmissionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartnerId:
      name: id
      in: path
      required: true
      description: The partner's id
      schema:
        type: string
        format: uuid
    ReviewerId:
      name: reviewerId
      in: path
      required: true
      description: The reviewer's account email
      schema:
        type: string
  schemas:
    TrainingOverview:
      type: object
      required: [upcomingSessions, seatsFilled, totalSeats, mentorshipFollowUps, sessions, followUps]
      properties:
        upcomingSessions:
          type: integer
          format: int64
          description: Sessions that are UPCOMING
        seatsFilled:
          type: integer
          format: int64
          description: Seats held across UPCOMING and IN_PROGRESS sessions
        totalSeats:
          type: integer
          format: int64
          description: Capacity across UPCOMING and IN_PROGRESS sessions
        mentorshipFollowUps:
          type: integer
          format: int64
          description: Follow-ups that are not COMPLETED
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TrainingSession'
        followUps:
          type: array
          items:
            $ref: '#/components/schemas/MentorshipFollowUp'
    TrainingSession:
      type: object
      required: [id, title, facilitator, date, enrolledCount, capacity, venue, status, description, participants, departmentId, endsAt, fee, safetyCourse, published]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        facilitator:
          type: string
        date:
          type: string
          format: date-time
          description: Start time, ISO-8601 with the Kampala offset, for example 2026-10-29T09:00:00+03:00
        enrolledCount:
          type: integer
          description: Participants holding a seat (PENDING_PAYMENT or CONFIRMED)
        capacity:
          type: integer
        venue:
          type: string
        status:
          $ref: '#/components/schemas/TrainingSessionStatus'
        description:
          type: string
        participants:
          type: array
          description: Participants holding a seat, in registration order; removed registrations are not listed
          items:
            $ref: '#/components/schemas/TrainingParticipant'
        departmentId:
          type: string
          format: uuid
        endsAt:
          type: string
          format: date-time
        fee:
          type: integer
          description: Whole UGX; 0 for a free session
        safetyCourse:
          type: boolean
        published:
          type: boolean
    TrainingSessionStatus:
      type: string
      description: DRAFT when not published; otherwise UPCOMING before the start, IN_PROGRESS until the end, then COMPLETED
      enum: [DRAFT, UPCOMING, IN_PROGRESS, COMPLETED]
    TrainingParticipant:
      type: object
      required: [id, name, regNumber, department, contactEmail, status, attendance, passed, registeredAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        regNumber:
          type: string
        department:
          type: string
          description: The participant's own department as free text
        contactEmail:
          type: [string, 'null']
        status:
          type: string
          enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED]
        attendance:
          type: string
          enum: [PRESENT, ABSENT, EXCUSED, UNMARKED]
        passed:
          type: boolean
          description: Set only for safety courses
        registeredAt:
          type: string
          format: date-time
    CreateTrainingSessionRequest:
      type: object
      required: [title, facilitator, date, capacity, venue, departmentId]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        facilitator:
          type: string
          maxLength: 200
        date:
          type: string
          format: date-time
          description: Start time with an offset, for example 2026-10-29T09:00:00+03:00
        endsAt:
          type: string
          format: date-time
          description: Defaults to two hours after `date`; must be later than `date`
        capacity:
          type: integer
          minimum: 1
        venue:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        departmentId:
