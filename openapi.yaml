openapi: 3.1.0
info:
  title: Makerere Innovation Hub ERP API
  version: 1.0.0
  description: |
    REST contract for the Makerere Innovation Hub ERP intake and case workflow.

    A submission receives its tracking reference when it is created and remains a draft while
    information is being completed. The submitter then submits it for reception review; reception
    verifies the brief, may request missing information or documents, and either forwards it to a
    sector, confirms it as a project, or rejects it. Student evidence is required before
    registration; general-public cases must not include student-specific fields.

    Three categories are supported: `student`, `general`, and `service_request`. Service requests
    describe a requested service (`serviceRequested`), who is asking (`serviceRequester`), the
    requesting department, and the `expectedResult`; the service fields are required when the
    brief is submitted.

    ## Base URL

    All paths are relative to the API base URL. Production:
    `https://backend-unipod.onrender.com/api`. Local development: `http://localhost:8080/api`.

    ## Authentication

    1. Call `POST /auth/login` with an administrator-provisioned email and password.
    2. Send the returned `accessToken` on every protected request as
       `Authorization: Bearer <accessToken>`.
    3. Tokens are short-lived (default 15 minutes, exposed as `expiresAt`). There is no refresh
       endpoint; log in again before expiry.

    Public signup is disabled. Accounts are created by an Administrator with
    `POST /admin/users`.

    ## Roles

    Role names are the exact upper-case values from `ApiUserRole`. Each operation lists the roles
    it accepts in its `x-required-roles` extension and its description. `401` means the token is
    missing, expired, or invalid; `403` means the token is valid but the role is not allowed.

    ## CORS

    Browser requests are allowed from these exact origins by default:

    - `http://localhost:5173` (Vite development server)
    - `http://localhost:3000`

    Additional origins are configured on the backend with `CORS_ALLOWED_ORIGINS`
    (comma-separated exact origins; wildcards are not used). Allowed methods are `GET`, `POST`,
    `PUT`, `PATCH`, `DELETE`, and `OPTIONS`; all request headers are accepted; credentials are
    enabled; the `Location` response header is exposed; preflight results are cached for 3600
    seconds. To integrate a new frontend origin, add it to `CORS_ALLOWED_ORIGINS` and redeploy.

    ## Errors

    Errors use RFC 7807 `application/problem+json` with `type`, `title`, `status`, and `detail`.
    Unexpected `500` responses also include a support `reference`. Validation failures return
    `400`; authorization `403`; missing resources `404`; state or version conflicts `409`;
    unprocessable fact-finding payloads `422`; oversized uploads `413`.

    ## Pagination

    List endpoints accept `page` (zero-based, default `0`) and `size` (default `25`, maximum
    `100`), and return `items`, `page`, `size`, `totalElements`, and `totalPages`.

    ## Concurrency

    Case, document, sector, and fact-finding writes require the current `version`. Send the
    version you last read; a stale version returns `409` and the resource must be reloaded.

    ## Identifiers and timestamps

    IDs are UUID strings. Intake codes follow `(STU|GEN|SRV)-<year>-<sequence>`; a confirmed
    project receives a `PRJ-<year>-<sequence>` project code. Timestamps are ISO-8601 instants in
    UTC (for example `2026-03-10T09:30:00Z`).

    ## Files

    `POST /submissions/{id}/documents/upload` accepts `multipart/form-data`; the server generates
    the opaque `fileReference`. Files are limited to 15 MB (15,728,640 bytes) and must be one of
    PDF, Word, Excel, PowerPoint, RTF, ZIP, plain text, CSV, common image types, and the design
    formats DXF, DWG, STL, and SVG (an allowed file extension is accepted when the browser reports
    `application/octet-stream`). `GET
    /submissions/{id}/documents/{documentId}/file` streams the stored bytes as an attachment.
    Never construct a `fileReference` yourself. Uploading a document increments its per-type
    `version` and resolves a matching open document request.
servers:
  - url: https://backend-unipod.onrender.com/api
    description: Production API on Render
  - url: /api
    description: API context path for local development
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Login and administrator-only account provisioning
  - name: Submissions
    description: Intake, registration, documents, and forwarding
  - name: Reception
    description: Reception work queue
  - name: Dashboard
    description: Pipeline overview metrics
  - name: Sectors
    description: Sector catalog and routing
  - name: Case Files
    description: Case file aggregate, controls, stages, outcome, and document review
  - name: Fact-Finding
    description: Structured brief assessment and readiness for review
  - name: Audit
    description: Append-only audit log (AD2) and the history panel on a brief
  - name: Notifications
    description: The in-app bell (NT1). Always the signed-in person's own notifications
  - name: Configuration
    description: Read-only settings from ConfigService (case code format, review defaults, document rules, departments)
  - name: Partners
    description: |
      Partners and their MOUs (operations module F5). Reads are open to every role except
      SUBMITTER; writes need ADMINISTRATOR or DEPARTMENT_COORDINATOR. Dates are `YYYY-MM-DD`,
      enums are upper case, and a missing date is `null`. A value that fails validation (blank,
      too long, missing) is `422`. A broken body, an unknown field or a bad enum or date value is
      `400`, and so is a rule the request shape cannot express, such as a blank `name` on PATCH.
x-cors:
  allowedOrigins:
    - http://localhost:5173
    - http://localhost:3000
  configurableVia: CORS_ALLOWED_ORIGINS
  allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allowedHeaders: ['*']
  exposedHeaders: [Location]
  allowCredentials: true
  maxAgeSeconds: 3600
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      x-required-roles: []
      summary: Exchange administrator-provisioned credentials for a bearer token
      description: Public account registration is disabled. Login failures return the same response for unknown, disabled, or invalid credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Short-lived bearer access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      x-required-roles: []
      summary: Change the authenticated account's password
      description: |
        Requires a valid bearer token. The current password must match, and the new
        password must be 12-72 characters and different from the current password.
        A successful change clears the temporary-password flag returned by login.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/set-password:
    post:
      tags: [Authentication]
      operationId: setPassword
      x-required-roles: []
      summary: Set a password using a one-time setup token
      description: |
        Public endpoint for a submitter who received a password setup link during an
        assisted submission. The token is single-use and expires after 72 hours; an
        unknown, used, or expired token returns 400. A successful call also clears the
        temporary-password flag.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Password set
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/users:
    post:
      tags: [Authentication]
      operationId: createApiUser
      x-required-roles: [ADMINISTRATOR]
      summary: Create an account with an application role
      description: Administrator only. The password is never returned; public signup is not available.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiUserRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An account with this email already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, SUBMITTER]
      summary: Create an intake draft
      description: |
        Available to Administrator, Innovation Coordinator, Receptionist,
        Fact-Finding Officer, and Submitter. A Submitter's identity is taken
        from the authenticated principal; a supplied submitterId cannot change
        ownership. Intake staff may create walk-in submissions for another
        submitter. A unique case code is allocated atomically at creation.

        Student fields apply to `student` briefs, service fields apply to
        `service_request` briefs, and general briefs leave both groups empty.
        The draft is completed with `PUT /submissions/{id}` and submitted with
        `POST /submissions/{id}/submit`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
            examples:
              student:
                value:
                  category: student
                  title: Low-cost irrigation monitor
                  purpose: Prototype a low-cost monitor for small farms
                  problemAddressed: Farmers lack timely soil-moisture information
                  studentNumber: "2026001234"
                  programme: Agricultural Engineering
                  supervisor: Dr Example
                  recommendationLetterStatus: submitted
              general:
                value:
                  category: general
                  title: Community solar charging point
                  purpose: Explore a shared charging point
                  problemAddressed: Limited access to reliable charging
                  submitterId: submitter@example.test
                  submitterEmail: submitter@example.test
              service_request:
                value:
                  category: service_request
                  title: Prototype enclosure for soil sensor
                  purpose: Build a weatherproof enclosure for field testing
                  problemAddressed: The current sensor housing fails in rain
                  serviceRequested: Prototyping and fabrication
                  serviceRequester: staff
                  department: Agricultural Engineering
                  expectedResult: Three tested enclosures and a build guide
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Submissions]
      operationId: listSubmissions
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, IP_LIAISON, OBSERVER, SUBMITTER, REVIEWER, SECTOR_OFFICER]
      summary: List all submissions
      description: Results are role-scoped, filtered, paginated, and stably ordered by received date then id.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: category
          in: query
          description: Submission type.
          schema:
            type: string
            enum: [student, general, service_request]
        - name: stage
          in: query
          description: Current submission status.
          schema:
            $ref: '#/components/schemas/SubmissionStage'
        - name: sector
          in: query
          description: Responsible department.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Case-insensitive substring match on tracking reference, title, or submitter name.
          schema:
            type: string
        - name: receivedFrom
          in: query
          description: Inclusive lower bound on the received date (Africa/Kampala).
          schema:
            type: string
            format: date
        - name: receivedTo
          in: query
          description: Inclusive upper bound on the received date (Africa/Kampala).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: A page of submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /submissions/assisted:
    post:
      tags: [Submissions]
      operationId: createAssistedSubmission
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER]
      summary: Create a walk-in submission with a minimal submitter account
      description: |
        Reception can capture a walk-in brief and create a minimal `SUBMITTER`
        account in one step. If the email already has an account it is reused.
        When a new account is created, `temporaryPassword` is returned exactly
        once and `mustChangePassword` is set so the submitter changes it at first
        login. A single-use `setPasswordToken` and `setPasswordUrl` are also
        returned so the submitter can choose their own password through
        `POST /auth/set-password`; the token expires after 72 hours. The account
        and draft are committed together. Service-request fields are accepted
        for `service_request` briefs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistedSubmissionRequest'
      responses:
        '201':
          description: Draft and submitter account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistedSubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/search:
    get:
      tags: [Submissions]
      operationId: searchSubmissions
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, IP_LIAISON, OBSERVER, SUBMITTER, REVIEWER, SECTOR_OFFICER]
      summary: Search submissions by reference, title, or submitter name
      description: |
        An exact tracking-reference match is returned first. Otherwise the value is matched as a
        case-insensitive substring against the tracking reference (project code), title, and submitter name.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Matching submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /submissions/mine:
    get:
      tags: [Submissions]
      operationId: listMySubmissions
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER]
      summary: List submissions created by the authenticated user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of the caller's submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/submissions:
    get:
      tags: [Submissions]
      operationId: listMySubmitterSubmissions
      x-required-roles: [SUBMITTER]
      summary: List the authenticated submitter's own briefs
      description: |
        Returns only submissions whose `submitter_id` is the signed-in
        principal; staff-only fields are omitted. Each row includes
        `pendingAction`, `waitingForYou`, and `waitingSince` so the home screen
        can highlight work waiting for the submitter. Use `tab` to split the
        Briefs and Service requests tabs; Invoices and payments and Bookings are
        separate modules advertised by `GET /me/capabilities`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: tab
          in: query
          required: false
          description: |
            Optional submitter-home tab filter. Omit to return all owned cases.
            Matching is case-insensitive and accepts `SERVICE-REQUESTS` as well
            as `SERVICE_REQUESTS`. Invoices and bookings are not served by this
            endpoint.
          schema:
            type: string
            enum: [BRIEFS, SERVICE_REQUESTS]
      responses:
        '200':
          description: Submitter-owned submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitterSubmissionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/submissions/{id}:
    get:
      tags: [Submissions]
      operationId: getMySubmission
      x-required-roles: [SUBMITTER]
      summary: Get one submitter-owned submission
      description: Returns the submitter-facing view of a submission owned by the authenticated submitter. Another submitter's case returns 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Submitter-owned submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitterSubmission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/capabilities:
    get:
      tags: [Submissions]
      operationId: getSubmitterCapabilities
      x-required-roles: [SUBMITTER]
      summary: Return what the authenticated submitter can do
      description: |
        Reports the submitter's own abilities and the availability of every
        submitter-home tab. Briefs and service requests are served by this
        backend. Invoices and payments (D4) and bookings (F1) are delivered by
        other modules, report `NOT_CONFIGURED`, and keep the matching action
        flags false until those integrations are connected.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Submitter actions and module availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitterCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/{id}/register:
    post:
      tags: [Submissions]
      operationId: registerSubmission
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER]
      summary: Register a submission as received
      description: |
        Available to Administrator, Innovation Coordinator, Receptionist, and
        Fact-Finding Officer. Preserves the code assigned at creation.
        Student number, programme, supervisor, and recommendation-letter status must be present for
        student submissions. A submission can be registered only once.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Submission registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/submit:
    post:
      tags: [Submissions]
      operationId: submitSubmission
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, SUBMITTER]
      summary: Submit a draft for reception review
      description: |
        Moves a draft to `SUBMITTED`, stamps `submittedAt`, and publishes a
        `submission.submitted` notification to the submitter. A submitter may
        submit only their own draft. Student briefs require student number,
        programme, supervisor, and recommendation-letter status; service requests
        require `serviceRequested` and `expectedResult`. A blank department is
        suggested from the active sector names. Submitting a brief that is not a
        draft returns 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Submitted brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/reply:
    post:
      tags: [Submissions]
      operationId: replyToInformationRequest
      x-required-roles: [SUBMITTER]
      summary: Reply to an information request
      description: |
        Available to the owning submitter while the brief is `SUBMITTED` or
        `AWAITING_INFORMATION`. Every field is optional so the submitter can send
        only the missing detail. Open information requests are resolved
        automatically; the brief returns to `SUBMITTED` and a
        `submission.reply_received` notification is published.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplySubmissionRequest'
      responses:
        '200':
          description: Updated brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/confirm-project:
    post:
      tags: [Submissions]
      operationId: confirmSubmissionAsProject
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER]
      summary: Confirm a brief as a project
      description: |
        Closes the intake decision by moving the brief to `CONFIRMED_AS_PROJECT`.
        The optional `projectCode` is used when supplied; when blank the server
        allocates the next `PRJ-<year>-<sequence>` code. A
        `submission.confirmed_as_project` notification is published to the
        submitter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmProjectRequest'
      responses:
        '200':
          description: Confirmed project brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/reject:
    post:
      tags: [Submissions]
      operationId: rejectSubmission
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER]
      summary: Reject a brief
      description: |
        Closes the intake decision by moving the brief to `REJECTED` with the
        required `reason`. Outstanding information requests are cleared and a
        `submission.rejected` notification is published to the submitter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectSubmissionRequest'
      responses:
        '200':
          description: Rejected brief
