          pattern: '^(STU|GEN|SRV)-[0-9]{4}-[0-9]{6,19}$'
        category:
          type: string
          enum: [student, general, service_request]
        title:
          type: string
        purpose:
          type: string
        problemAddressed:
          type: string
        registeredBy:
          type: string
        submitterId:
          type: string
        submitterName:
          type: [string, 'null']
          description: Display name supplied for the submitter, when available.
        submitterEmail:
          type: [string, 'null']
        submitterPhone:
          type: [string, 'null']
        receivingOfficer:
          type: [string, 'null']
        assignedReviewerSubject:
          type: [string, 'null']
        studentNumber:
          type: [string, 'null']
        programme:
          type: [string, 'null']
        supervisor:
          type: [string, 'null']
        recommendationLetterStatus:
          oneOf:
            - $ref: '#/components/schemas/RecommendationLetterStatus'
            - type: 'null'
        serviceRequested:
          type: [string, 'null']
        serviceRequester:
          oneOf:
            - $ref: '#/components/schemas/ServiceRequester'
            - type: 'null'
        department:
          type: [string, 'null']
        expectedResult:
          type: [string, 'null']
        projectCode:
          type: [string, 'null']
          description: Project reference assigned when the brief is confirmed as a project.
        briefVersion:
          type: integer
          description: Incremented each time the brief content is changed.
        acceptedRulesVersion:
          type: [string, 'null']
        responsibleSectorId:
          type: [string, 'null']
          format: uuid
        responsibleSectorName:
          type: [string, 'null']
        stage:
          $ref: '#/components/schemas/SubmissionStage'
        receivedAt:
          type: [string, 'null']
          format: date-time
        submittedAt:
          type: [string, 'null']
          format: date-time
        forwardedAt:
          type: [string, 'null']
          format: date-time
        forwardNote:
          type: [string, 'null']
        forwardedBy:
          type: [string, 'null']
        confirmedAt:
          type: [string, 'null']
          format: date-time
        rejectionReason:
          type: [string, 'null']
        informationRequestedNote:
          type: [string, 'null']
        informationRequestedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    SubmitterCapabilities:
      type: object
      required: [canCreateBrief, canEditDraft, canSubmitDraft, canRespondToInformationRequest, canUploadDocuments, canUploadPaymentProof, canBook, modules, message]
      properties:
        canCreateBrief:
          type: boolean
        canEditDraft:
          type: boolean
        canSubmitDraft:
          type: boolean
        canRespondToInformationRequest:
          type: boolean
        canUploadDocuments:
          type: boolean
          description: Uploads are allowed only while the brief is DRAFT, SUBMITTED, or AWAITING_INFORMATION.
        canUploadPaymentProof:
          type: boolean
          description: False while the invoices and payments module reports NOT_CONFIGURED.
        canBook:
          type: boolean
          description: False while the bookings module reports NOT_CONFIGURED.
        modules:
          type: array
          items:
            $ref: '#/components/schemas/SubmitterModule'
        message:
          type: string
    SubmitterModule:
      type: object
      required: [key, label, availability]
      properties:
        key:
          type: string
          enum: [BRIEFS, SERVICE_REQUESTS, INVOICES, BOOKINGS]
        label:
          type: string
        availability:
          type: string
          enum: [AVAILABLE, NOT_CONFIGURED]
        reason:
          type: [string, 'null']
    SubmitterPendingAction:
      type: string
      enum: [CONTINUE_DRAFT, PROVIDE_INFORMATION, PROVIDE_DOCUMENT]
    FactFindingState:
      type: string
      enum: [NOT_STARTED, DRAFT, COMPLETED]
    FactFindingResult:
      type: string
      enum: [READY_FOR_REVIEW, NEEDS_MORE_INFORMATION]
    FactFindingCheck:
      type: object
      description: Fact-finding answers for the latest round of a brief.
      required: [briefId, briefTitle, briefType, round, state]
      properties:
        briefId:
          type: string
          format: uuid
        briefTitle:
          type: string
        trackingReference:
          type: [string, 'null']
          description: Case code when the brief has been registered.
        briefType:
          type: string
          enum: [student, general]
        round:
          type: integer
          minimum: 1
        officerId:
          type: [string, 'null']
        titleClear:
          type: [boolean, 'null']
        titleNote:
          type: [string, 'null']
        purposeClear:
          type: [boolean, 'null']
        purposeNote:
          type: [string, 'null']
        evidenceEnough:
          type: [boolean, 'null']
        evidenceNote:
          type: [string, 'null']
        relevantToHub:
          type: [boolean, 'null']
        relevantNote:
          type: [string, 'null']
        missingItems:
          type: [string, 'null']
        result:
          anyOf:
            - $ref: '#/components/schemas/FactFindingResult'
            - type: 'null'
        completedAt:
          type: [string, 'null']
          format: date-time
        state:
          $ref: '#/components/schemas/FactFindingState'
        version:
          type: [integer, 'null']
          format: int64
    SaveFactFindingRequest:
      type: object
      additionalProperties: false
      description: |
        Partial answers for the open draft. Omit `version` when starting a new round; include it
        when updating an existing draft. Server-owned fields are ignored.
      properties:
        titleClear:
          type: boolean
        titleNote:
          type: [string, 'null']
          maxLength: 1000
        purposeClear:
          type: boolean
        purposeNote:
          type: [string, 'null']
          maxLength: 1000
        evidenceEnough:
          type: boolean
        evidenceNote:
          type: [string, 'null']
          maxLength: 1000
        relevantToHub:
          type: boolean
        relevantNote:
          type: [string, 'null']
          maxLength: 1000
        missingItems:
          type: [string, 'null']
          maxLength: 2000
        version:
          type: [integer, 'null']
          format: int64
          minimum: 0
    CompleteFactFindingRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: Current version of the open draft check.
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        reference:
          type: string
          description: Support reference included for unexpected server errors.
        code:
          type: string
          description: |
            Machine-readable reason, present on every error. Generic codes come from the
            status (INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT,
            VALIDATION_FAILED, INTERNAL_ERROR, ...). Specific ones include
            ROLE_NOT_PERMITTED, NOT_OWNER, NOT_ASSIGNED, OUTSIDE_DEPARTMENT, MALFORMED_BODY,
            MISSING_PARAMETER, INVALID_PARAMETER, SUBMISSION_INVALID, SUBMISSION_NOT_FOUND,
            SUBMISSION_CONFLICT, SECTOR_NOT_FOUND, SECTOR_CONFLICT, DOCUMENT_NOT_FOUND,
            NOTIFICATION_NOT_FOUND.
        errors:
          type: array
          description: Present on 422 responses. One entry per invalid field.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: [string, 'null']
        message:
          type: string
    PartnerType:
      type: string
      enum: [INDUSTRY_PARTNER, FUNDER, ACADEMIC_PARTNER]
    PartnerStatus:
      type: string
      description: |
        Derived from `renewalDate` and today's date in Kampala, never stored. Past the date is
        `EXPIRED`; 0 to 30 days left is `EXPIRING_SOON`; 31 to 60 days is `RENEWAL_DUE`; anything
        further out, or no date, is `ACTIVE`. The 30 and 60 day limits are configurable.
      enum: [ACTIVE, RENEWAL_DUE, EXPIRING_SOON, EXPIRED]
    Partner:
      type: object
      required: [id, name, type, renewalDate, status, contactPerson, contactEmail, notes, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/PartnerType'
        renewalDate:
          type: [string, 'null']
          format: date
          description: When the current MOU ends, `YYYY-MM-DD`. `null` when no MOU date is recorded.
        status:
          $ref: '#/components/schemas/PartnerStatus'
        contactPerson:
          type: [string, 'null']
        contactEmail:
          type: [string, 'null']
        notes:
          type: [string, 'null']
        version:
          type: integer
          format: int64
          description: Send this back in `PATCH` so a stale edit is refused with `409`.
      example:
        id: 5b0f6d0e-6a53-4c0b-9d59-3f1d3d7a2c11
        name: Acme Uganda Ltd
        type: INDUSTRY_PARTNER
        renewalDate: '2027-03-01'
        status: ACTIVE
        contactPerson: Jane Doe
        contactEmail: jane@acme.example
        notes: Prefers email
        version: 0
    PartnersOverview:
      type: object
      required: [totalPartners, renewalDueCount, partners]
      properties:
        totalPartners:
          type: integer
          format: int64
        renewalDueCount:
          type: integer
          format: int64
          description: Partners whose status is not `ACTIVE`
        partners:
          type: array
          items:
            $ref: '#/components/schemas/Partner'
    CreatePartnerRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/PartnerType'
        renewalDate:
          type: [string, 'null']
          format: date
        contactPerson:
          type: [string, 'null']
          maxLength: 255
        contactEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        notes:
          type: [string, 'null']
          maxLength: 2000
    UpdatePartnerRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: Only `version` is required. Fields left out are not changed.
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/PartnerType'
        renewalDate:
          type: string
          format: date
          description: Replaces the current date. It cannot be cleared.
        contactPerson:
          type: string
          maxLength: 255
          description: An empty string clears it
        contactEmail:
          type: string
          format: email
          maxLength: 254
          description: An empty string clears it
        notes:
          type: string
          maxLength: 2000
          description: An empty string clears it
    RecordMouRenewalRequest:
      type: object
      additionalProperties: false
      required: [renewalDate]
      properties:
        renewalDate:
          type: string
          format: date
        documentReference:
          type: [string, 'null']
          maxLength: 500
          description: Reference to the signed MOU. Replaces the previous one; leave out to clear it.
  responses:
    ValidationFailed:
      description: One or more request values are invalid. The body lists each field in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Malformed request (broken JSON, wrong parameter type, missing parameter)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: A valid bearer token is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated user lacks a role allowed by this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state or version of the resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The payload is valid JSON but cannot be processed in its current form
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error. The response includes a support reference but no internal details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
