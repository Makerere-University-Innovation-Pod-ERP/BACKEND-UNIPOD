          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /operations/partners/{id}/mou:
    put:
      tags: [Partners]
      operationId: recordPartnerMouRenewal
      x-required-roles: [ADMINISTRATOR, DEPARTMENT_COORDINATOR]
      summary: Record a renewed MOU
      description: |
        Replaces the renewal date and the document reference; leaving `documentReference` out
        clears the previous one. The reference is stored but is not part of the `Partner`
        response. The new date may be in the past. No `version` is needed; if two renewals race,
        the loser gets `409`. Renewing a partner that was due or expired returns it to `ACTIVE`
        when the new date is far enough away; once the daily job has seen it as `ACTIVE`, its next
        warning is announced again. Recorded in the audit log as `partner.mou_renewed`.
      parameters:
        - $ref: '#/components/parameters/PartnerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMouRenewalRequest'
      responses:
        '200':
          description: The partner with the new renewal date and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SubmissionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartnerId:
      name: id
      in: path
      required: true
      description: The partner's id
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 128
    LoginResponse:
      type: object
      required: [tokenType, accessToken, expiresAt, mustChangePassword]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        mustChangePassword:
          type: boolean
          description: |
            True when the account was created through assisted submission and
            still uses its one-time temporary password.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          maxLength: 72
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72
    CreateApiUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        role:
          $ref: '#/components/schemas/ApiUserRole'
    ApiUser:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/ApiUserRole'
        createdAt:
          type: string
          format: date-time
    ApiUserRole:
      type: string
      enum:
        - ADMINISTRATOR
        - INNOVATION_COORDINATOR
        - RECEPTIONIST
        - FACT_FINDING_OFFICER
        - REVIEWER
        - SECTOR_OFFICER
        - IP_LIAISON
        - SUBMITTER
        - OBSERVER
    CreateSubmissionRequest:
      type: object
      additionalProperties: false
      required: [category, title, purpose, problemAddressed]
      properties:
        category:
          type: string
          enum: [student, general, service_request]
        title:
          type: string
          minLength: 1
          maxLength: 240
        purpose:
          type: string
          minLength: 1
          maxLength: 5000
        problemAddressed:
          type: string
          minLength: 1
          maxLength: 5000
        submitterId:
          type: [string, 'null']
          maxLength: 255
        submitterEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        submitterName:
          type: [string, 'null']
          maxLength: 255
        submitterPhone:
          type: [string, 'null']
          maxLength: 40
        studentNumber:
          type: string
          maxLength: 80
        programme:
          type: string
          maxLength: 200
        supervisor:
          type: string
          maxLength: 255
        recommendationLetterStatus:
          $ref: '#/components/schemas/RecommendationLetterStatus'
        serviceRequested:
          type: [string, 'null']
          maxLength: 255
          description: The service the requester needs (for example prototyping or testing).
        serviceRequester:
          oneOf:
            - $ref: '#/components/schemas/ServiceRequester'
            - type: 'null'
        department:
          type: [string, 'null']
          maxLength: 255
          description: Requesting department. A blank value is suggested from active sector names at submit time.
        expectedResult:
          type: [string, 'null']
          maxLength: 5000
          description: What the requester expects the hub to deliver.
        acceptedRulesVersion:
          type: [string, 'null']
          maxLength: 32
          description: Version of the intake rules the submitter accepted.
      allOf:
        - if:
            properties:
              category:
                const: general
          then:
            not:
              anyOf:
                - required: [studentNumber]
                - required: [programme]
                - required: [supervisor]
                - required: [recommendationLetterStatus]
                - required: [serviceRequested]
                - required: [serviceRequester]
                - required: [expectedResult]
    RequestInformationRequest:
      type: object
      additionalProperties: false
      description: |
        Provide `reason`, `items`, or both. The single `note` form remains
        supported for older clients and is used as the request summary when
        present. Each item becomes an open missing item.
      anyOf:
        - required: [note]
        - required: [reason]
        - required: [items]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
        reason:
          type: string
          minLength: 1
          maxLength: 255
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MissingItemRequest'
    ReceptionCheckItemKey:
      type: string
      enum:
        - DETAILS_COMPLETE
        - DOCUMENTS_COMPLETE
        - FILES_READABLE
        - CORRECT_TYPE
    ReceptionCheckItemRequest:
      type: object
      additionalProperties: false
      required: [key, checked]
      properties:
        key:
          $ref: '#/components/schemas/ReceptionCheckItemKey'
        checked:
          type: boolean
        note:
          type: string
          maxLength: 2000
    ReceptionCheckUpdateRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReceptionCheckItemRequest'
    ReceptionCheckItemResponse:
      type: object
      required: [key, label, checked]
      properties:
        key:
          $ref: '#/components/schemas/ReceptionCheckItemKey'
        label:
          type: string
        checked:
          type: boolean
        note:
          type: [string, 'null']
        checkedBy:
          type: [string, 'null']
        checkedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
    ReceptionCheckResponse:
      type: object
      required: [submissionId, complete, checkedCount, totalCount, items]
      properties:
        submissionId:
          type: string
          format: uuid
        complete:
          type: boolean
        checkedCount:
          type: integer
        totalCount:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceptionCheckItemResponse'
    MissingItemKind:
      type: string
      enum: [INFORMATION, DOCUMENT]
    MissingItemStatus:
      type: string
      enum: [OPEN, RESOLVED]
    MissingItemRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 255
        note:
          type: string
          maxLength: 2000
        documentType:
          $ref: '#/components/schemas/DocumentType'
        reason:
          type: string
          maxLength: 255
          description: Why the item is needed.
        dueAt:
          type: [string, 'null']
          format: date-time
          description: Optional deadline shown to the submitter.
        message:
          type: string
          maxLength: 2000
          description: Submitter-facing instructions for this item.
    MissingItemsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MissingItemRequest'
    MissingItemResponse:
      type: object
      required: [id, kind, label, status, requestedBy, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MissingItemKind'
        label:
          type: string
        note:
          type: [string, 'null']
        reason:
          type: [string, 'null']
        dueAt:
          type: [string, 'null']
          format: date-time
        message:
          type: [string, 'null']
        documentType:
          oneOf:
            - $ref: '#/components/schemas/DocumentType'
            - type: 'null'
        status:
          $ref: '#/components/schemas/MissingItemStatus'
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        lastRemindedAt:
          type: [string, 'null']
          format: date-time
        resolvedBy:
          type: [string, 'null']
        resolvedAt:
          type: [string, 'null']
          format: date-time
        resolutionNote:
          type: [string, 'null']
    MissingItemsResponse:
      type: object
      required: [submissionId, openCount, items]
      properties:
        submissionId:
          type: string
          format: uuid
        openCount:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/MissingItemResponse'
    ResolveMissingItemRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 2000
    SendReminderRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 2000
    AssistedSubmissionRequest:
      type: object
      additionalProperties: false
      required: [submitterEmail, category, title, purpose, problemAddressed]
      properties:
        submitterEmail:
          type: string
          format: email
          maxLength: 254
        category:
          type: string
          enum: [student, general, service_request]
        title:
          type: string
          minLength: 1
          maxLength: 240
        purpose:
          type: string
          minLength: 1
          maxLength: 5000
        problemAddressed:
          type: string
          minLength: 1
          maxLength: 5000
        studentNumber:
          type: string
          maxLength: 80
        programme:
          type: string
          maxLength: 200
        supervisor:
          type: string
          maxLength: 255
        recommendationLetterStatus:
          $ref: '#/components/schemas/RecommendationLetterStatus'
        submitterPhone:
          type: [string, 'null']
          maxLength: 40
        serviceRequested:
          type: [string, 'null']
          maxLength: 255
        serviceRequester:
          oneOf:
            - $ref: '#/components/schemas/ServiceRequester'
            - type: 'null'
        department:
          type: [string, 'null']
          maxLength: 255
        expectedResult:
          type: [string, 'null']
          maxLength: 5000
        acceptedRulesVersion:
          type: [string, 'null']
          maxLength: 32
    AssistedAccountResponse:
      type: object
      required: [email, created]
      properties:
        email:
          type: string
          format: email
        created:
          type: boolean
        temporaryPassword:
          type: [string, 'null']
          description: Returned only once when a new account is created.
        setPasswordToken:
          type: [string, 'null']
          description: Single-use token for `POST /auth/set-password`; expires after 72 hours.
        setPasswordUrl:
          type: [string, 'null']
          description: Frontend link that includes the setup token.
    AssistedSubmissionResponse:
      type: object
      required: [submission, account]
      properties:
        submission:
          $ref: '#/components/schemas/Submission'
        account:
          $ref: '#/components/schemas/AssistedAccountResponse'
    RecommendationLetterStatus:
      type: string
      enum: [verified, submitted, one_file, not_required]
    ServiceRequester:
      type: string
      enum: [student, staff, external, other]
      description: Who is asking for a service.
    SubmissionStage:
      type: string
      enum: [DRAFT, SUBMITTED, AWAITING_INFORMATION, RECEIVED, REGISTERED, FACT_FINDING, UNDER_REVIEW, REFINEMENT_REQUESTED, FURTHER_HANDLING, FORWARDED, IN_PROGRESS, CONFIRMED_AS_PROJECT, REJECTED, COMPLETED]
    CaseStage:
      type: string
      enum: [RECEIVED, REGISTERED, FACT_FINDING, UNDER_REVIEW, REFINEMENT_REQUESTED, FURTHER_HANDLING, COMPLETED]
    OutcomeStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, DECIDED]
    DocumentStatus:
      type: string
      enum: [REQUIRED, OPTIONAL, MISSING, VERIFIED, SUBMITTED, ONE_FILE, NOT_REQUIRED]
      description: |
        Intake states are `REQUIRED`, `OPTIONAL`, and `MISSING`; `VERIFIED`,
        `SUBMITTED`, `ONE_FILE`, and `NOT_REQUIRED` are retained for the case
        file review workflow.
    DocumentType:
      type: string
      enum: [PROJECT_BRIEF, RECOMMENDATION_LETTER, SUPPORTING_EVIDENCE, OTHER]
    ForwardSubmissionRequest:
      type: object
      additionalProperties: false
      required: [sectorId]
      properties:
        sectorId:
          type: string
          format: uuid
        note:
          type: [string, 'null']
          maxLength: 2000
          description: Optional handover note recorded on the brief and in the stage history.
    SetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          maxLength: 256
          description: Single-use setup token from the assisted submission response.
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72
    ReplySubmissionRequest:
      type: object
      additionalProperties: false
      description: Partial brief supplied by the submitter in response to an information request.
      properties:
        title:
          type: [string, 'null']
          maxLength: 240
        purpose:
          type: [string, 'null']
          maxLength: 5000
        problemAddressed:
          type: [string, 'null']
          maxLength: 5000
        studentNumber:
          type: [string, 'null']
          maxLength: 80
        programme:
          type: [string, 'null']
          maxLength: 200
        supervisor:
          type: [string, 'null']
          maxLength: 255
        recommendationLetterStatus:
          oneOf:
            - $ref: '#/components/schemas/RecommendationLetterStatus'
            - type: 'null'
        submitterPhone:
          type: [string, 'null']
          maxLength: 40
        serviceRequested:
          type: [string, 'null']
          maxLength: 255
        department:
          type: [string, 'null']
          maxLength: 255
        expectedResult:
          type: [string, 'null']
          maxLength: 5000
        note:
          type: [string, 'null']
          maxLength: 2000
    ConfirmProjectRequest:
      type: object
      additionalProperties: false
      properties:
        projectCode:
          type: [string, 'null']
          maxLength: 32
          description: Optional project code. A `PRJ-<year>-<sequence>` code is allocated when blank.
        note:
          type: [string, 'null']
          maxLength: 2000
    RejectSubmissionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    AdvanceSubmissionRequest:
      type: object
      additionalProperties: false
      required: [stage]
      properties:
        stage:
          type: string
          enum: [IN_PROGRESS, COMPLETED]
    CreateDocumentRequest:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        documentType:
          $ref: '#/components/schemas/DocumentType'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileReference:
          type: [string, 'null']
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
        version:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Optional explicit document version. The server assigns the next version when omitted.
    SubmissionDocument:
      type: object
      required: [id, submissionId, name, documentType, status, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        name:
          type: string
        documentType:
          $ref: '#/components/schemas/DocumentType'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileReference:
          type: [string, 'null']
        contentType:
          type: [string, 'null']
        fileSize:
          type: [integer, 'null']
          format: int64
        originalFilename:
          type: [string, 'null']
          maxLength: 255
        version:
          type: integer
          format: int64
          description: Per-document-type version, starting at 1.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    SectorRequest:
      type: object
      additionalProperties: false
      required: [name, notificationEmail, active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        notificationEmail:
          type: string
          format: email
          maxLength: 320
        active:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
          description: Expected sector version for updates; omit when creating a sector.
    Sector:
      allOf:
        - $ref: '#/components/schemas/SectorRequest'
        - type: object
          required: [id, version, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    SectorFilterOption:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ReviewerAssignmentRequest:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: [string, 'null']
          maxLength: 255
    SectorMemberRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
    AuditEntry:
      type: object
      required: [id, occurredAt, actor, actorRole, action, entityType]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
          description: Email of the person who acted
        actorRole:
          type: string
        action:
          type: string
          example: user.created
        entityType:
          type: string
          example: user
        entityId:
          type: [string, 'null']
          format: uuid
        before:
          type: [object, 'null']
          additionalProperties: true
          description: The record before the change (null on create)
        after:
          type: [object, 'null']
          additionalProperties: true
          description: The record after the change (null on delete)
        departmentId:
          type: [string, 'null']
          format: uuid
        requestId:
          type: [string, 'null']
          description: The X-Request-Id header of the request that made the change, if one was sent
    AuditEntryPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Notification:
      type: object
      required: [id, type, title, createdAt, read]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [BRIEF_SUBMITTED, DOCUMENT_REQUESTED, BRIEF_FORWARDED, REVIEWER_ASSIGNED, REVIEW_SUBMITTED, IMPROVEMENT_REQUESTED, NEW_VERSION_RECEIVED, PROJECT_CONFIRMED, PAYMENT_PROOF_UPLOADED, PAYMENT_CONFIRMED, PAYMENT_REJECTED, BOOKING_APPROVED, EQUIPMENT_APPROVAL_REQUESTED, FAULT_REPORTED, LOW_STOCK, AGREEMENT_EXPIRING]
        title:
          type: string
        body:
          type: [string, 'null']
        entityType:
          type: [string, 'null']
          description: What it is about, e.g. submission, so the frontend can link to it
        entityId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, 'null']
          format: date-time
        read:
          type: boolean
    NotificationPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    UnreadCount:
      type: object
      required: [unread]
      properties:
        unread:
          type: integer
          format: int64
    ReadAllResult:
      type: object
      required: [marked]
      properties:
        marked:
          type: integer
    Config:
      type: object
      required: [caseCodeStudentPrefix, caseCodeGeneralPrefix, caseCodeSequenceDigits, defaultReviewMode, defaultRequiredReviews, recommendationLetterRequiredFor, departments]
      properties:
        caseCodeStudentPrefix:
          type: string
          example: STU
        caseCodeGeneralPrefix:
          type: string
          example: GEN
        caseCodeSequenceDigits:
          type: integer
          example: 6
        defaultReviewMode:
          type: string
          enum: [PARALLEL, SEQUENTIAL]
        defaultRequiredReviews:
          type: integer
          example: 2
        recommendationLetterRequiredFor:
          type: array
          items:
            type: string
            enum: [student, general]
        departments:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
    SubmissionPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Submission'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    SubmitterSubmissionPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmitterSubmission'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    SubmitterSubmission:
      type: object
      required:
        - id
        - category
        - title
        - purpose
        - problemAddressed
        - stage
        - pendingAction
        - waitingForYou
        - waitingSince
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: [string, 'null']
        submitterName:
          type: [string, 'null']
        category:
          type: string
          enum: [student, general, service_request]
        title:
          type: string
        purpose:
          type: string
        problemAddressed:
          type: string
        studentNumber:
          type: [string, 'null']
        programme:
          type: [string, 'null']
        supervisor:
          type: [string, 'null']
        recommendationLetterStatus:
          anyOf:
            - $ref: '#/components/schemas/RecommendationLetterStatus'
            - type: 'null'
        serviceRequested:
          type: [string, 'null']
        serviceRequester:
          oneOf:
            - $ref: '#/components/schemas/ServiceRequester'
            - type: 'null'
        department:
          type: [string, 'null']
        expectedResult:
          type: [string, 'null']
        projectCode:
          type: [string, 'null']
        briefVersion:
          type: integer
        stage:
          $ref: '#/components/schemas/SubmissionStage'
        pendingAction:
          description: Action the submitter has to take, or null when nothing is waiting.
          oneOf:
