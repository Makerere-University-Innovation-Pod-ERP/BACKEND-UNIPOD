  /operations/training/sessions/{id}/participants:
    post:
      tags: [Training]
      operationId: registerTrainingParticipant
      x-required-roles: [ADMINISTRATOR, DEPARTMENT_COORDINATOR]
      summary: Register a participant
      description: |
        Coordinators register people by name and registration number. The seat is taken under a
        lock on the session, so two requests can never take the last seat. A free session confirms
        the registration at once; a paid one is PENDING_PAYMENT until
        `POST .../participants/{participantId}/confirm-payment`. Both states hold a seat.
        Answers 409 when the session is full ("This session is full."), when the registration
        number is already registered for the session, and once the session has ended.
        The action is recorded in the audit log without the participant's personal details.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTrainingParticipantRequest'
      responses:
        '201':
          description: The updated session, including the new participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
