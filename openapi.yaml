    CreateSubmissionRequest:
      type: object
      additionalProperties: false
      required: [category, title, purpose, problemAddressed]
      properties:
        category:
          type: string
          enum: [student, general, service_request]
        title:
          type: string
          minLength: 1
          maxLength: 240
        purpose:
          type: string
          minLength: 1
          maxLength: 5000
        problemAddressed:
          type: string
          minLength: 1
          maxLength: 5000
        submitterId:
          type: [string, 'null']
          maxLength: 255
        submitterEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        submitterName:
          type: [string, 'null']
          maxLength: 255
        submitterPhone:
          type: [string, 'null']
          maxLength: 40
        studentNumber:
          type: string
          maxLength: 80
        programme:
          type: string
          maxLength: 200
        supervisor:
          type: string
          maxLength: 255
        recommendationLetterStatus:
          $ref: '#/components/schemas/RecommendationLetterStatus'
        serviceRequested:
          type: [string, 'null']
          maxLength: 255
          description: The service the requester needs (for example prototyping or testing).
        serviceRequester:
          oneOf:
            - $ref: '#/components/schemas/ServiceRequester'
            - type: 'null'
        department:
          type: [string, 'null']
          maxLength: 255
          description: Requesting department. A blank value is suggested from active sector names at submit time.
        expectedResult:
          type: [string, 'null']
          maxLength: 5000
          description: What the requester expects the hub to deliver.
        preferredAt:
          type: [string, 'null']
          format: date-time
          description: Preferred date and time for a service request. Required before the brief is registered or submitted.
        acceptedRulesVersion:
          type: [string, 'null']
          maxLength: 32
          description: Version of the intake rules the submitter accepted. Required before the brief is registered or submitted.
      allOf:
        - if:
            properties:
              category:
                const: general
          then:
            not:
              anyOf:
                - required: [studentNumber]
                - required: [programme]
                - required: [supervisor]
                - required: [recommendationLetterStatus]
                - required: [serviceRequested]
                - required: [serviceRequester]
                - required: [expectedResult]
    RequestInformationRequest:
      type: object
