          enum: [DRAFT, NEW, AWAITING_DETAILS, RETURNED, QUOTED, SCHEDULED, IN_PROGRESS, DONE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        estimate:
          oneOf:
            - $ref: '#/components/schemas/TelecomsRequestEstimate'
            - type: 'null'
        quote:
          oneOf:
            - $ref: '#/components/schemas/TelecomsRequestQuote'
            - type: 'null'
        payment:
          type: object
          required: [status, reference, confirmedAt]
          properties:
            status:
              $ref: '#/components/schemas/PaymentStatus'
            reference:
              type: [string, 'null']
            confirmedAt:
              type: [string, 'null']
              format: date-time
        workDetails:
          type: object
          required: [technician, partsUsed, timeSpent, notes]
          properties:
            technician:
              type: string
            partsUsed:
              type: string
            timeSpent:
              type: string
            notes:
              type: string
        history:
          type: array
          items:
            type: object
            required: [status, by, at, note]
            properties:
              status:
                type: string
                enum: [DRAFT, NEW, AWAITING_DETAILS, RETURNED, QUOTED, SCHEDULED, IN_PROGRESS, DONE]
              by:
                type: string
              at:
                type: string
                format: date-time
              note:
                type: [string, 'null']
    TelecomsRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelecomsRequest'
    TelecomsRequestPayload:
      type: object
      additionalProperties: false
      required: [customerName, customerType, serviceWanted, equipmentInvolved, preferredDate, rulesAccepted]
      properties:
        customerName:
          type: string
          maxLength: 200
        customerType:
          type: string
          enum: [Student, Public, Company, Research Group, Internal]
        serviceWanted:
          type: string
          maxLength: 2000
        equipmentInvolved:
          type: string
          maxLength: 1000
        preferredDate:
          type: [string, 'null']
          format: date
        rulesAccepted:
          type: boolean
        estimate:
          oneOf:
            - $ref: '#/components/schemas/TelecomsRequestEstimate'
            - type: 'null'
        draft:
          type: boolean
          description: When true, save a partial draft instead of submitting it.
    TelecomsRequestEstimate:
      type: object
      required: [parts, priceListItemId, priceQuantity]
      properties:
        parts:
          type: array
          maxItems: 100
          items:
            type: object
            required: [itemId, quantity]
            properties:
              itemId:
                type: string
                format: uuid
              quantity:
                type: number
                exclusiveMinimum: 0
        priceListItemId:
          type: [string, 'null']
          format: uuid
        priceQuantity:
          type: number
          exclusiveMinimum: 0
    TelecomsRequestQuote:
      type: object
      required: [amount, currency, priceListItemId, priceQuantity, expectedCompletion, sentAt, sentBy]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          description: Whole UGX amount computed from the selected active price and quantity.
        currency:
          type: string
          enum: [UGX]
        priceListItemId:
          type: string
          format: uuid
        priceQuantity:
          type: number
          exclusiveMinimum: 0
        expectedCompletion:
          type: string
          format: date
        sentAt:
          type: string
          format: date-time
        sentBy:
          type: string
    TelecomsQuoteRequest:
      type: object
      additionalProperties: false
      required: [amount, priceListItemId, priceQuantity, expectedCompletion, estimate]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        priceListItemId:
          type: string
          format: uuid
        priceQuantity:
          type: number
          exclusiveMinimum: 0
        expectedCompletion:
          type: string
          format: date
        estimate:
          $ref: '#/components/schemas/TelecomsRequestEstimate'
    TelecomsPriceListItem:
      type: object
      required: [id, label, unit, unitPrice]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        unit:
          type: string
        unitPrice:
          type: integer
          minimum: 0
          description: UGX per unit
    TelecomsPriceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelecomsPriceListItem'
    Bootcamp:
      type: object
      required: [id, topic, instructor, date, start, end, capacity, fee, enrolled, attendance]
      properties:
        id:
          type: string
          format: uuid
        topic:
          type: string
        instructor:
          type: string
        date:
          type: string
          format: date
        start:
          type: string
          example: '09:00'
        end:
          type: string
          example: '16:00'
        capacity:
          type: integer
        fee:
          type: integer
          description: Whole UGX
        enrolled:
          type: array
          items:
            type: object
            required: [id, name, email, studentNumber, paymentStatus, enrolledAt]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              email:
                type: string
              studentNumber:
                type: string
                nullable: true
              paymentStatus:
                $ref: '#/components/schemas/PaymentStatus'
              enrolledAt:
                type: string
                format: date-time
        attendance:
          type: array
          items:
            type: object
            required: [participantId, status]
            properties:
              participantId:
                type: string
                format: uuid
              status:
                type: string
                enum: [PRESENT, ABSENT]
    BootcampList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bootcamp'
    CreateBootcampRequest:
      type: object
      additionalProperties: false
      required: [topic, instructor, date, start, end, capacity, fee]
      properties:
        topic:
          type: string
          maxLength: 200
        instructor:
          type: string
          maxLength: 200
        date:
          type: string
          format: date
        start:
          type: string
          example: '09:00'
        end:
          type: string
          example: '16:00'
        capacity:
          type: integer
          minimum: 1
          maximum: 500
        fee:
          type: integer
          minimum: 0
          description: Whole UGX
    EnrollBootcampRequest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        studentNumber:
          type: string
          maxLength: 50
          description: May be blank for someone outside the university
    SaveBootcampAttendanceRequest:
      type: object
      additionalProperties: false
      required: [attendance]
      properties:
        attendance:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [participantId, status]
            properties:
              participantId:
                type: string
                format: uuid
              status:
                type: string
                enum: [PRESENT, ABSENT]
    TimetableBlock:
      type: object
      required: [id, facility_id, department, title, starts_at, ends_at, source]
      properties:
        id:
          type: string
          format: uuid
        facility_id:
          type: string
          format: uuid
        department:
          type: [string, 'null']
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        recurrence_rule:
          type: [string, 'null']
        recurrence_until:
          type: [string, 'null']
          format: date
        source:
          type: [string, 'null']
    CreateTimetableBlockRequest:
      type: object
      additionalProperties: false
      required: [title, starts_at, ends_at]
      properties:
        facility_id:
          type: string
          format: uuid
        department:
          type: string
          maxLength: 100
        title:
          type: string
          minLength: 1
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: Must be after `starts_at`.
        recurrence_rule:
          type: string
          description: With `recurrence_until`, generates weekly occurrences capped at 52.
        recurrence_until:
          type: string
          format: date
        source:
          type: string
    DepartmentOrderStage:
      type: string
      description: |
        The valid value depends on the department. Multimedia: NEW, QUOTED, PAYMENT_GATE, SCHEDULED,
        IN_PRODUCTION, READY, DELIVERED, COMPLETED. Textile: NEW, QUOTED, PAYMENT_GATE, SCHEDULED,
        CUTTING, SEWING, QC, READY, COLLECTED. CNC: NEW, QUOTED, PAYMENT_GATE, SCHEDULED,
        IN_PRODUCTION, READY, COLLECTED. Telecoms: NEW, QUOTED, PAYMENT_GATE, SCHEDULED, IN_PROGRESS,
        READY, DONE.
      enum: [NEW, QUOTED, PAYMENT_GATE, SCHEDULED, IN_PRODUCTION, CUTTING, SEWING, QC, IN_PROGRESS, READY, DELIVERED, COLLECTED, COMPLETED, DONE]
    DepartmentOrderStageHistoryEntry:
      type: object
      required: [stage, at, by]
      properties:
        stage:
          type: string
        at:
          type: string
          format: date-time
        by:
          type: string
        notes:
          type: string
      additionalProperties: true
    DepartmentOrder:
      type: object
      required: [id, code, department, customerId, title, quantity, stage, specs, stageHistory, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Generated as `ORD-<DEPT>-<YEAR>-<6-digit sequence>`.
        department:
          type: string
          enum: [MULTIMEDIA, TEXTILE, CNC, TELECOMS]
        customerId:
          type: string
        title:
          type: string
        quantity:
          type: integer
        dateNeeded:
          type: [string, 'null']
          format: date
        acceptedRulesVersion:
          type: [string, 'null']
        stage:
          $ref: '#/components/schemas/DepartmentOrderStage'
        specs:
          type: object
        quote:
          type: [object, 'null']
        quoteSubmittedAt:
          type: [string, 'null']
          format: date-time
        quotedBy:
          type: [string, 'null']
        invoiceId:
          type: [string, 'null']
          format: uuid
        invoiceStatus:
          type: [string, 'null']
          description: The linked invoice status, when one exists.
        materialsUsed:
          type: [object, array, 'null']
        paymentConfirmedAt:
          type: [string, 'null']
          format: date-time
        machineTimeUsed:
          type: [string, 'null']
        qualityChecklist:
          type: [object, 'null']
        collectionSignature:
          type: [string, 'null']
        stageHistory:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentOrderStageHistoryEntry'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DepartmentOrderPage:
      type: object
      required: [department, columns, page, size, totalElements, totalPages]
      properties:
        department:
          type: string
          enum: [MULTIMEDIA, TEXTILE, CNC, TELECOMS]
        columns:
          type: object
          description: One key per valid stage for the department; unknown stages are added when orders use them.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/DepartmentOrder'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    DepartmentOrderRequest:
      type: object
      additionalProperties: false
      required: [title, specs]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        specs:
          type: object
          description: Free-form order specification; must be present.
        quantity:
          type: integer
          minimum: 1
          description: Defaults to 1 when omitted.
        date_needed:
          type: string
          format: date
        accepted_rules_version:
          type: string
          maxLength: 32
    DepartmentOrderQuoteRequest:
      type: object
      additionalProperties: false
      required: [quote]
      properties:
        quote:
          type: object
          required: [amount]
          properties:
            amount:
              type: integer
              format: int64
              minimum: 1
              description: Whole UGX.
            description:
              type: string
            customerEmail:
              type: string
              format: email
            customerName:
              type: string
    DepartmentOrderStageRequest:
      type: object
      additionalProperties: false
      required: [stage]
      properties:
        stage:
          type: string
          minLength: 1
          description: Case-insensitive stage name; spaces and hyphens are normalised to underscores.
        materials_used:
          type: [object, array, 'null']
          description: Each element carries `sku` or `itemId` and `qty` or `quantity`; deducted on first completion-stage entry.
        machine_time_used:
          type: [string, 'null']
        quality_checklist:
          type: [object, 'null']
        collection_signature:
          type: [string, 'null']
        notes:
          type: [string, 'null']
    MediaContractStatus:
      type: string
      enum: [DRAFT, SIGNED, IN_PROGRESS, COMPLETED, CANCELLED]
    MediaContract:
      type: object
      required: [id, code, client, eventName, eventDate, agreedPrice, currency, milestonePaymentDates, assignedStaff, status, invoiceIds, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Generated as `MCTR-<YEAR>-<4-digit sequence>`.
        client:
          type: string
        eventName:
          type: string
        eventDate:
          type: string
          format: date
        venue:
          type: [string, 'null']
        agreedPrice:
          type: integer
          format: int64
          description: Whole UGX.
        currency:
          type: string
          example: UGX
        milestonePaymentDates:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type: integer
                format: int64
        signedContractDocId:
          type: [string, 'null']
          format: uuid
        assignedStaff:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/MediaContractStatus'
        invoiceIds:
          type: array
          items:
            type: string
            format: uuid
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MediaContractRequest:
      type: object
      additionalProperties: false
      required: [client, event_name, event_date, agreed_price]
      properties:
        client:
          type: string
          minLength: 1
          maxLength: 255
        event_name:
          type: string
          minLength: 1
          maxLength: 255
        event_date:
          type: string
          format: date
        venue:
          type: string
          maxLength: 255
        agreed_price:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          maxLength: 3
          default: UGX
        customer_email:
          type: string
          format: email
          maxLength: 254
          description: Required when `generate_invoices` is true.
        milestone_payment_dates:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type: integer
                format: int64
        signed_contract_doc_id:
          type: string
          format: uuid
        assigned_staff:
          type: array
          items:
            type: string
        generate_invoices:
          type: boolean
          description: Requires ADMINISTRATOR or FINANCE_OFFICER; only UGX and a customer email are allowed.
    MediaContractStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/MediaContractStatus'
        signed_contract_doc_id:
          type: string
          format: uuid
          description: May be supplied only when moving to SIGNED.
    MediaRequestStatus:
      type: string
      enum: [REQUESTED, SCHEDULED, IN_PRODUCTION, DELIVERED, COMPLETED, CANCELLED]
    MediaRequestBoardCard:
      type: object
      required: [submissionId]
      properties:
        submissionId:
          type: string
          format: uuid
        status:
          type: [string, 'null']
    MediaDeliveryPayload:
      type: object
      properties:
        delivery_links:
          type: array
          items:
            type: string
        file_ids:
          type: array
          items:
            type: string
            format: uuid
        note_to_submitter:
          type: string
    MediaRequest:
      type: object
      required: [id, code, submitterId, title, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Generated as `MRQ-<YEAR>-<6-digit sequence>`.
        briefId:
          type: [string, 'null']
          format: uuid
        departmentOrderId:
          type: [string, 'null']
          format: uuid
        submitterId:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/MediaRequestStatus'
        deliveredAt:
          type: [string, 'null']
          format: date-time
        deliveredBy:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        boardCard:
          allOf:
            - $ref: '#/components/schemas/MediaRequestBoardCard'
          nullable: true
        deliveryPayload:
          allOf:
            - $ref: '#/components/schemas/MediaDeliveryPayload'
          nullable: true
    MediaRequestDeliveryResponse:
      type: object
      required: [id, code, submitterId, title, status, createdAt, updatedAt, briefStatus, boardCard]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        briefId:
          type: [string, 'null']
          format: uuid
        departmentOrderId:
          type: [string, 'null']
          format: uuid
        submitterId:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/MediaRequestStatus'
        deliveredAt:
          type: [string, 'null']
          format: date-time
        deliveredBy:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        briefStatus:
          type: [string, 'null']
          description: The linked submission's current stage name.
        boardCard:
          allOf:
            - $ref: '#/components/schemas/MediaRequestBoardCard'
          nullable: true
        deliveryPayload:
          allOf:
            - $ref: '#/components/schemas/MediaDeliveryPayload'
          nullable: true
    MediaRequestCreateRequest:
      type: object
      additionalProperties: false
      required: [submitterId, title]
      properties:
        briefId:
          type: string
          format: uuid
        departmentOrderId:
          type: string
          format: uuid
        submitterId:
          type: string
          minLength: 1
          maxLength: 254
          description: Must match the linked brief owner or order customer.
        title:
          type: string
          minLength: 1
          maxLength: 255
    MediaDeliverRequest:
      type: object
      additionalProperties: false
      properties:
        delivery_links:
          type: array
          items:
            type: string
        file_ids:
          type: array
          items:
            type: string
            format: uuid
        note_to_submitter:
          type: string
    BulkAttendancePassRequest:
      type: object
      additionalProperties: false
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: Participant ids or user ids to mark as passed.
    BulkAttendancePassResponse:
      type: object
      required: [session_id, passed_count, eligible_unlocked_count]
      properties:
        session_id:
          type: string
          format: uuid
        passed_count:
          type: integer
        eligible_unlocked_count:
          type: integer
    AllocationDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          minLength: 1
          description: >-
            `APPROVED`, `DECLINED` or `REJECTED`, case-insensitive.
        note:
          type: string
          maxLength: 500
          description: Required when declining; becomes the rejection reason.
    AllocationReturnRequest:
      type: object
      additionalProperties: false
      required: [returned_at, condition_returned]
      properties:
        returned_at:
          type: string
          format: date-time
        condition_returned:
          type: string
          enum: [WORKING, OK, DAMAGED, BEING_REPAIRED, FAULTY]
          description: >-
            `OK` normalises to WORKING; `FAULTY` normalises to BEING_REPAIRED.
        notes:
          type: string
          maxLength: 2000
  responses:
    ValidationFailed:
      description: One or more request values are invalid. The body lists each field in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Malformed request (broken JSON, wrong parameter type, missing parameter)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request Content-Type does not match the media type this operation consumes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: A valid bearer token is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        The authenticated user lacks permission for this operation: their role is not allowed,
        they are not a member of the required department, or they do not own the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state or version of the resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The payload is valid JSON but cannot be processed in its current form
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error. The response includes a support reference but no internal details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
