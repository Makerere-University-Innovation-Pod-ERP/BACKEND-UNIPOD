        decision must be Confirmed as project, Needs more improvement, or Closed
        with a reason, and a non-blank note is required. Confirming a project
        requires a destination department. A `Needs more improvement` decision
        also requires a due date and at least one requested change; the
        corresponding refinement request is created atomically with the outcome.
        Save is rejected with 409 until the
        configured reviewer quorum is available and met, and once a decision has
        been saved the outcome is locked against further changes.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
