  /submissions/{id}/respond-info:
    post:
      tags: [Submissions]
      operationId: respondToSubmissionInfoRequest
      x-required-roles: [SUBMITTER]
      summary: Upload the missing files and answer an information request
      description: |
        The owning submitter uploads one or more `files` (or a single `file`)
        together with an optional reply `note`. Each uploaded file must name the
        open requested item it answers through `documentItemIds`; a document
        item supplies the file's document type, an information item defaults it
        to `OTHER`, and the named item is the only item the file resolves. The
        brief returns from `AWAITING_INFORMATION` to `SUBMITTED` and reception
        is notified. Sent as `multipart/form-data` with at least one of `note`,
        `files` or `file`; a request with none of them is rejected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 2000
                documentItemIds:
                  type: array
                  description: >-
                    One open requested item id per uploaded file, in the same
                    order as `files`/`file`. Required when a file is uploaded.
                  items:
                    type: string
                    format: uuid
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                file:
                  type: string
                  format: binary
              anyOf:
                - required: [note]
                - required: [files]
                - required: [file]
      responses:
        '200':
          description: Brief returned to the reception queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
