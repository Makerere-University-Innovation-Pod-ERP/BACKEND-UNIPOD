openapi: 3.1.0
info:
  title: Makerere Innovation Hub ERP API
  version: 1.0.0
  description: |
    REST contract for the Makerere Innovation Hub ERP intake and case workflow.

    A submission receives an immutable `BRF-<year>-<sequence>` tracking reference when it is
    created and remains a draft while information is being completed. The submitter then submits
    it for reception review; reception verifies the brief, may request missing information or
    documents, and either forwards it to a sector, confirms it as a project, or closes it with a
    reason. Student evidence is required before registration; general-public cases must not include
    student-specific fields.

    Three categories are supported: `student`, `general`, and `service_request`. Service requests
    describe a requested service (`serviceRequested`), who is asking (`serviceRequester`), the
    requesting department, the `expectedResult`, and a preferred `preferredAt` date and time; the
    service fields are required when the brief is submitted. The submitter must accept the current
    intake rules (`acceptedRulesVersion`) before a brief can be registered or submitted. General
    and student briefs without a department default to `Innovation`. Reception must complete the
    four-line reception checklist before forwarding a brief, and only the draft owner may edit
    draft content; staff record corrections through comments and information requests instead.

    ## Base URL

    All paths are relative to the API base URL. Production:
    `https://backend-unipod.onrender.com/api`. Local development: `http://localhost:8080/api`.

    ## Authentication

    1. Call `POST /auth/login` with your email and password. Submitters create their own
       account with `POST /auth/signup`, which also returns a token.
    2. Send the returned `accessToken` on every protected request as
       `Authorization: Bearer <accessToken>`.
    3. Tokens are short-lived (default 15 minutes, exposed as `expiresAt`). There is no refresh
       endpoint; log in again before expiry.

    Students, members of the public and organisations sign up with `POST /auth/signup`.
    Staff accounts are created by an Administrator with `POST /admin/users`.

    ## Roles

    Role names are the exact upper-case values from `ApiUserRole`. Each operation lists the roles
    it accepts in its `x-required-roles` extension and its description. `401` means the token is
    missing, expired, or invalid; `403` means the token is valid but the role is not allowed.

    ## CORS

    Browser requests are allowed from these exact origins by default:

    - `http://localhost:5173` (Vite development server)
    - `http://localhost:3000`

    Additional origins are configured on the backend with `CORS_ALLOWED_ORIGINS`
    (comma-separated exact origins; wildcards are not used). Allowed methods are `GET`, `POST`,
    `PUT`, `PATCH`, `DELETE`, and `OPTIONS`; all request headers are accepted; credentials are
    enabled; the `Location` response header is exposed; preflight results are cached for 3600
    seconds. To integrate a new frontend origin, add it to `CORS_ALLOWED_ORIGINS` and redeploy.

    ## Errors

    Errors use RFC 7807 `application/problem+json` with `type`, `title`, `status`, and `detail`.
    Unexpected `500` responses also include a support `reference`. Validation failures return
    `400`; authorization `403`; missing resources `404`; state or version conflicts `409`;
    unprocessable fact-finding payloads `422`; oversized uploads `413`.

    ## Pagination

    List endpoints accept `page` (zero-based, default `0`) and `size` (default `25`, maximum
    `100`), and return `items`, `page`, `size`, `totalElements`, and `totalPages`.

    ## Concurrency

    Case, document, sector, and fact-finding writes require the current `version`. Send the
    version you last read; a stale version returns `409` and the resource must be reloaded.

    ## Identifiers and timestamps

    IDs are UUID strings. Every submission tracking reference follows
    `BRF-<year>-<sequence>`. A confirmed project receives a category-prefixed
    `(STU|GEN|SRV)-<year>-<sequence>` project code from a separate sequence. Timestamps are
    ISO-8601 instants in UTC (for example `2026-03-10T09:30:00Z`).

    ## Files

    `POST /submissions/{id}/documents/upload` accepts `multipart/form-data`; the server generates
    the opaque `fileReference`. Files are limited to 15 MB (15,728,640 bytes) and must be one of
    PDF, Word, Excel, PowerPoint, RTF, ZIP, plain text, CSV, common image types, and the design
    formats DXF, DWG, STL, and SVG (an allowed file extension is accepted when the browser reports
    `application/octet-stream`). `GET
    /submissions/{id}/documents/{documentId}/file` streams the stored bytes as an attachment.
    Never construct a `fileReference` yourself. Uploading a document increments its per-type
    `version` and resolves a matching open document request.
servers:
  - url: https://backend-unipod.onrender.com/api
    description: Production API on Render
  - url: /api
    description: API context path for local development
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Login and administrator-only account provisioning
  - name: Submissions
    description: Intake, registration, documents, and forwarding
  - name: Reception
    description: Reception work queue
  - name: Dashboard
    description: Pipeline overview metrics
  - name: Training
    description: Training sessions, registrations, attendance and mentorship follow-ups (Operations)
  - name: Sectors
    description: Sector catalog and routing
  - name: Case Files
    description: Case file aggregate, controls, stages, outcome, and document review
  - name: Fact-Finding
    description: Structured brief assessment and readiness for review
  - name: Reviews
    description: Review settings, reviewer assignment, quorum, the reviewer queue, and reviewer submissions
  - name: Audit
    description: Append-only audit log (AD2) and the history panel on a brief
  - name: Notifications
    description: The in-app bell (NT1). Always the signed-in person's own notifications
  - name: Configuration
    description: Read-only settings from ConfigService (case code format, review defaults, document rules, departments)
  - name: Partners
    description: |
      Partners and their MOUs (operations module F5). Reads are open to every role except
      SUBMITTER; writes need ADMINISTRATOR or DEPARTMENT_COORDINATOR. Dates are `YYYY-MM-DD`,
      enums are upper case, and a missing date is `null`. A value that fails validation (blank,
      too long, missing) is `422`. A broken body, an unknown field or a bad enum or date value is
      `400`, and so is a rule the request shape cannot express, such as a renewal date outside the
      years 1900 to 2999.
  - name: Finance
    description: |
      Invoices, payment evidence, verification and receipts (finance module D4). Submitters see and
      act only on invoices whose `customerEmail` matches their authenticated subject; another
      submitter's invoice, proof or receipt is reported as `404`. Payment evidence is uploaded as
      `multipart/form-data` with `reference`, `amount`, `paidOn` and `file`. Money values are UGX
      integers.
  - name: Facilities
    description: |
      Facilities and bookings (facilities module F1). Submitters create and manage their own
      bookings; staff approve, reject, reschedule, check in and check out. Booking times are
      ISO-8601 instants. Overlapping active bookings for the same facility return `409`, as does a
      booking at a facility in `MAINTENANCE`.
x-cors:
  allowedOrigins:
    - http://localhost:5173
    - http://localhost:3000
  configurableVia: CORS_ALLOWED_ORIGINS
  allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allowedHeaders: ['*']
  exposedHeaders: [Location]
  allowCredentials: true
  maxAgeSeconds: 3600
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      x-required-roles: []
      summary: Exchange email and password for a bearer token
      description: Login failures return the same response for unknown, disabled, or invalid credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Short-lived bearer access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      x-required-roles: []
      summary: Change the authenticated account's password
      description: |
        Requires a valid bearer token. The current password must match, and the new
        password must be 12-72 characters and different from the current password.
        A successful change clears the temporary-password flag returned by login.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/set-password:
    post:
      tags: [Authentication]
      operationId: setPassword
      x-required-roles: []
      summary: Set a password using a one-time setup token
      description: |
        Public endpoint for a submitter who received a password setup link during an
        assisted submission. The token is single-use and expires after 72 hours; an
        unknown, used, or expired token returns 400. A successful call also clears the
        temporary-password flag.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Password set
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/signup:
    post:
      tags: [Authentication]
      operationId: signUp
      x-required-roles: []
      summary: Create a submitter account (student, public or organisation)
      description: |
        Public endpoint [AU1]. Creates a SUBMITTER account and its profile, records the
        accepted UniPod rules version, and returns a bearer token so the user lands on
        My submissions. Students must send studentNumber, course and universityEmail;
        organisations must send organisationName. Missing kind-specific fields return
        422 with one entry per field. An email or student number already in use returns 409.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created; bearer access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: forgotPassword
      x-required-roles: []
      summary: Email a one-time password reset link
      description: |
        Public endpoint [AU1]. Always returns 202, whether or not the email has an
        account, so the response cannot be used to find out who is registered. For an
        active account, emails a link for `POST /auth/set-password` that expires after
        one hour and replaces any earlier link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/users:
    post:
      tags: [Authentication]
      operationId: createApiUser
      x-required-roles: [ADMINISTRATOR]
      summary: Create an account with an application role
      description: Administrator only. The password is never returned; public signup is not available.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiUserRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An account with this email already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, SUBMITTER]
      summary: Create an intake draft
      description: |
        Available to Administrator, Innovation Coordinator, Receptionist,
        Fact-Finding Officer, and Submitter. A Submitter's identity is taken
        from the authenticated principal; a supplied submitterId cannot change
        ownership. Intake staff may create walk-in submissions for another
        submitter. A unique `BRF-<year>-<sequence>` tracking reference is allocated atomically at creation.

        Student fields apply to `student` briefs, service fields apply to
        `service_request` briefs, and general briefs leave both groups empty.
        The draft is completed with `PUT /submissions/{id}` and submitted with
        `POST /submissions/{id}/submit`. Both registration and submission require
        `acceptedRulesVersion`; `preferredAt` is required before a service request
        can be registered or submitted. A blank `department` defaults to
        `Innovation` for general and student briefs, and is suggested from active
        sector names for service requests.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
            examples:
              student:
                value:
                  category: student
                  title: Low-cost irrigation monitor
                  purpose: Prototype a low-cost monitor for small farms
                  problemAddressed: Farmers lack timely soil-moisture information
                  studentNumber: "2026001234"
                  programme: Agricultural Engineering
                  supervisor: Dr Example
                  recommendationLetterStatus: submitted
              general:
                value:
                  category: general
                  title: Community solar charging point
                  purpose: Explore a shared charging point
                  problemAddressed: Limited access to reliable charging
                  submitterId: submitter@example.test
                  submitterEmail: submitter@example.test
                  acceptedRulesVersion: "2026-01"
              service_request:
                value:
                  category: service_request
                  title: Prototype enclosure for soil sensor
                  purpose: Build a weatherproof enclosure for field testing
                  problemAddressed: The current sensor housing fails in rain
                  serviceRequested: Prototyping and fabrication
                  serviceRequester: staff
                  department: Agricultural Engineering
                  expectedResult: Three tested enclosures and a build guide
                  preferredAt: "2026-12-01T09:30:00Z"
                  acceptedRulesVersion: "2026-01"
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Submissions]
      operationId: listSubmissions
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, OBSERVER, SUBMITTER, REVIEWER, SECTOR_OFFICER]
      summary: List all submissions
      description: Results are role-scoped, filtered, paginated, and stably ordered by received date then id.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: category
          in: query
          description: Submission type.
          schema:
            type: string
            enum: [student, general, service_request]
        - name: stage
          in: query
          description: Current submission status.
          schema:
            $ref: '#/components/schemas/SubmissionStage'
        - name: sector
          in: query
          description: Responsible department.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Case-insensitive substring match on tracking reference, project code, title, or submitter name.
          schema:
            type: string
        - name: receivedFrom
          in: query
          description: Inclusive lower bound on the received date (Africa/Kampala).
          schema:
            type: string
            format: date
        - name: receivedTo
          in: query
          description: Inclusive upper bound on the received date (Africa/Kampala).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: A page of submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /submissions/assisted:
    post:
      tags: [Submissions]
      operationId: createAssistedSubmission
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER]
      summary: Create a walk-in submission with a minimal submitter account
      description: |
        Reception can capture a walk-in brief and create a minimal `SUBMITTER`
        account in one step. If the email already has an account it is reused.
        When a new account is created, `temporaryPassword` is returned exactly
        once and `mustChangePassword` is set so the submitter changes it at first
        login. A single-use `setPasswordToken` and `setPasswordUrl` are also
        returned so the submitter can choose their own password through
        `POST /auth/set-password`; the token expires after 72 hours. The account
        and draft are committed together. Service-request fields are accepted
        for `service_request` briefs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistedSubmissionRequest'
      responses:
        '201':
          description: Draft and submitter account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistedSubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/drafts:
    post:
      tags: [Submissions]
      operationId: createSubmissionDraft
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, SUBMITTER]
      summary: Save a new brief as a draft
      description: |
        Creates a partially completed brief. A draft has no tracking reference,
        is visible only to its submitter and intake staff, and is not placed in
        the reception queue or announced to reception. `category` is required
        to start a draft; every other field may be completed later through
        `PATCH /submissions/drafts/{id}` and the brief is finalised with
        `POST /submissions/{id}/submit`, which allocates the tracking reference.
        A submitter's identity is taken from the authenticated principal.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftSubmissionRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/drafts/{id}:
    patch:
      tags: [Submissions]
      operationId: patchSubmissionDraft
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, SUBMITTER]
      summary: Autosave a draft
      description: |
        Partial update used by the draft editor's autosave. Only the supplied
        fields change; omitted fields are left untouched. Returns 409 once the
        brief has left the `DRAFT` stage, so a stale editor cannot overwrite a
        submitted brief.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftSubmissionRequest'
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/walk-in:
    post:
      tags: [Submissions]
      operationId: createWalkInSubmission
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER]
      summary: Capture a walk-in brief for a submitter at reception
      description: |
        Receptionist-assisted intake. The submitter is matched by email first,
        then by phone. When neither resolves to an account a minimal account of
        the supplied `account_kind` (default `PUBLIC`) is created and the
        temporary password or set-password link is returned once. `registered_by`
        is the receptionist and `submitter_id` is the walk-in account. Unlike a
        draft, the brief is submitted immediately and appears in the reception
        queue. The request returns 400 when no account exists and no email is
        supplied, when the email and phone belong to different accounts, when
        more than one account shares the phone number, when the rules version is
        missing, or when the account-kind details needed for the profile are
        missing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkInSubmissionRequest'
      responses:
        '201':
          description: Submitted walk-in brief and its account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkInSubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/search:
    get:
      tags: [Submissions]
      operationId: searchSubmissions
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, OBSERVER, SUBMITTER, REVIEWER, SECTOR_OFFICER]
      summary: Search submissions by reference, project code, title, or submitter name
      description: |
        An exact tracking-reference or project-code match is returned first. Otherwise the value
        is matched as a case-insensitive substring against the tracking reference, project code,
        title, and submitter name.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Matching submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /submissions/mine:
    get:
      tags: [Submissions]
      operationId: listMySubmissions
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER]
      summary: List submissions created by the authenticated user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of the caller's submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me:
    get:
      tags: [Authentication]
      operationId: getMe
      x-required-roles: []
      summary: The signed-in user, role, home screen, departments, profile and capabilities
      description: |
        Call after login to decide which home screen to open (`MY_SUBMISSIONS` for
        submitters, `STAFF_HOME` for staff) and which actions to show. `capabilities`
        lists each action the role may take with its scope (OWN, ASSIGNED, DEPARTMENT
        or ALL). `profile` is null for staff accounts created by an administrator.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/submissions:
    get:
      tags: [Submissions]
      operationId: listMySubmitterSubmissions
      x-required-roles: [SUBMITTER]
      summary: List the authenticated submitter's own briefs
      description: |
        Returns only submissions whose `submitter_id` is the signed-in
        principal; staff-only fields are omitted. Each row includes
        `pendingAction`, `pendingActionHref`, `waitingForYou`, and
        `waitingSince` so the home screen can highlight work waiting for the
        submitter. `pendingActionHref` is an API path to follow for the details
