      operationId: createMediaContract
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, DEPARTMENT_COORDINATOR, SECTOR_OFFICER, FINANCE_OFFICER]
      summary: Create a media contract
      description: |
        Codes are generated as `MCTR-<YEAR>-<4-digit sequence>`. When `generate_invoices` is true,
        only ADMINISTRATOR or FINANCE_OFFICER may call the operation, currency must be `UGX`, and
        `customer_email` is required. Milestone invoices use `milestonePaymentDates`; each entry may
        carry `label` and `amount`, and amounts default to the agreed price divided by the number of
        milestones. Unknown document ids return `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaContractRequest'
      responses:
        '201':
          description: The created contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaContract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
