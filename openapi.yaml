      operationId: deliverMediaRequest
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, DEPARTMENT_COORDINATOR, SECTOR_OFFICER]
      summary: Deliver a media request
      description: |
        Records `delivery_links`, `file_ids` and a note, stamps the request `DELIVERED`, and notifies
        the submitter when their identity is an email address. The response also includes the linked
        submission's `briefStatus` and an updated `boardCard` with the card status.
