      description: |
        Moves the card one step: REQUESTED to SCHEDULED to IN_PRODUCTION to DELIVERED. A skip, a repeat, a move
        back, a move out of DELIVERED or a move of a cancelled request is `409`. `COMPLETED` and `CANCELLED` are
        not accepted values (`400`). Delivering stamps the delivery time and tells the submitter. A coordinator
        must belong to the Multimedia department.
