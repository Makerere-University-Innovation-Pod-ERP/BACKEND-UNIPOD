      summary: Add document metadata to a case
      description: |
        Records document metadata only. `fileReference` is optional and, when present, must be an
        opaque `[A-Za-z0-9_-]` identifier such as the value returned by the upload endpoint; URLs,
        filesystem paths, and raw file bytes are rejected. Submitters may only set status
        `SUBMITTED` and only for their own drafts.
      parameters:
