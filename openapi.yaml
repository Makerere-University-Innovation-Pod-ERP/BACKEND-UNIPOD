      x-required-roles: [ADMINISTRATOR, DEPARTMENT_COORDINATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, REVIEWER, SECTOR_OFFICER, IP_LIAISON, FINANCE_OFFICER, OBSERVER]
      summary: Everything the Partnerships screen needs in one call
      description: |
        The counts are computed from the data on every call. `renewalDueCount` is the number of
        partners whose status is not `ACTIVE`. `partners` has the same content and order as
        `GET /operations/partners`.
      responses:
