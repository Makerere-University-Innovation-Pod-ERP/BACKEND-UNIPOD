        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 2000
                documentItemIds:
                  type: array
                  description: >-
                    One open requested item id per uploaded file, in the same
                    order as `files`/`file`. Required when a file is uploaded.
                  items:
                    type: string
                    format: uuid
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                file:
                  type: string
                  format: binary
