      summary: Create or update the review settings
      description: |
        Available to Administrator and Innovation Coordinator while the brief is
        `READY_FOR_REVIEW` or `IN_REVIEW`; `READY_FOR_REVIEW` advances to
        `IN_REVIEW` when the write succeeds. Omit `version` when creating round one;
