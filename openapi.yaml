      summary: Quote a department work order
      description: |
        Records the quote and creates a JOB invoice for the order. `quote.amount` must be a positive
        whole UGX value; `description`, `customerEmail` and `customerName` are optional and default to
        the generated order description and the order customer. The order must belong to the department.
      parameters:
