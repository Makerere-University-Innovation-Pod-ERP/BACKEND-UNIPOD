      type: object
      required: [id, name, type, renewalDate, status, contactPerson, contactEmail, notes, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/PartnerType'
        renewalDate:
          type: [string, 'null']
          format: date
          description: When the current MOU ends, `YYYY-MM-DD`. `null` when no MOU date is recorded.
        status:
          $ref: '#/components/schemas/PartnerStatus'
        contactPerson:
          type: [string, 'null']
        contactEmail:
          type: [string, 'null']
        notes:
          type: [string, 'null']
        version:
          type: integer
          format: int64
          description: Send this back in `PATCH` so a stale edit is refused with `409`.
      example:
        id: 5b0f6d0e-6a53-4c0b-9d59-3f1d3d7a2c11
        name: Acme Uganda Ltd
        type: INDUSTRY_PARTNER
        renewalDate: '2027-03-01'
        status: ACTIVE
        contactPerson: Jane Doe
        contactEmail: jane@acme.example
        notes: Prefers email
        version: 0
