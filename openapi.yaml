  /operations/partners/{id}:
    patch:
      tags: [Partners]
      operationId: updatePartner
      x-required-roles: [ADMINISTRATOR, DEPARTMENT_COORDINATOR]
      summary: Change a partner's details
      description: |
        Send the `version` you last read plus only the fields you want to change; an omitted or
        `null` field is left as it is. An empty string clears `contactPerson`, `contactEmail` or
        `notes`. `renewalDate` can be replaced but not cleared. A stale `version`, or a `name`
        already used by another partner, returns `409`. A PATCH that changes nothing audited does
        not write an audit entry. Recorded in the audit log as `partner.updated`; contact details
        are never copied into it, only whether they changed.
      parameters:
        - $ref: '#/components/parameters/PartnerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartnerRequest'
      responses:
        '200':
          description: The partner after the change, with its new `version`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
