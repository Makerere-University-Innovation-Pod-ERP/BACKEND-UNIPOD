      summary: Telecoms lab calendar
      description: |
        Confirmed lab bookings that overlap the dates, soonest first, and the lab's weekly classes derived from
        its timetable blocks (`weekday` 1 = Monday, local `start` and `end`, repeated blocks merged). Without
        dates it is the current Kampala week; with one date the other end is a week away. At most three months.
        Cancelled, pending and rejected bookings are not listed. `paymentStatus` comes from the linked invoice,
        or `NOT_REQUESTED`.
      parameters:
        - name: from
          in: query
          required: false
          description: First day, YYYY-MM-DD (Kampala)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last day, YYYY-MM-DD (Kampala)
