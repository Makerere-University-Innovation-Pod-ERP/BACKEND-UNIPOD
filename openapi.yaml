          format: int64
        byStage:
          type: object
          additionalProperties:
            type: integer
            format: int64
        studentSubmissions:
          type: integer
          format: int64
        generalSubmissions:
          type: integer
          format: int64
        awaitingActionCount:
          type: integer
          format: int64
        forwardedCount:
          type: integer
          format: int64
        completedCount:
          type: integer
          format: int64
        recentlyUpdatedCount:
          type: integer
          format: int64
        awaitingReviewCount:
