      summary: All partners, soonest MOU renewal first
      description: |
        A plain array (not paged). Ordered by `renewalDate` ascending with partners that have no
        renewal date last, then by name ignoring case. `status` is worked out on every read from
        `renewalDate` and today's date in Kampala. Every role except SUBMITTER may read.
