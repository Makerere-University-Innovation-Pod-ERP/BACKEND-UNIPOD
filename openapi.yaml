      operationId: acceptImprovedCaseVersion
      x-required-roles: [INNOVATION_COORDINATOR, ADMINISTRATOR]
      summary: Accept the latest improved version and return the brief to review
      description: |
        A coordinator or administrator accepts the newest case revision for a brief in `RESUBMITTED`.
        The transition to `IN_REVIEW` and the audit write are atomic: a failed audit rolls back the
        stage change, its history row and the audit entry. `caseVersion` must be the current
        `$.submission.version` from `GET /cases/{id}`; a stale value returns 409. Accepting anything
        other than the latest revision, or acting when no improved version is waiting, also returns 409.
        The brief returns to its existing review round; start a new round explicitly with
        `POST /cases/{id}/review-rounds`.
