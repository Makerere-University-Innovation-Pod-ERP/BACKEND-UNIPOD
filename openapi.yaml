      operationId: transitionCase
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, FACT_FINDING_OFFICER]
      summary: Move a case to its next allowed stage
      description: |
        Administrator and Innovation Coordinator may perform any valid canonical
        transition. A Fact-Finding Officer may start fact-finding (`IN_FACT_FINDING`)
        from a `FORWARDED` case, then move an `IN_FACT_FINDING` case only to
        `READY_FOR_REVIEW` or `IMPROVEMENT_REQUESTED`. Moving to `READY_FOR_REVIEW`
        or `IN_REVIEW` from fact-finding requires a completed fact-finding check
        (FR-008), and `IMPROVEMENT_REQUESTED` requires a non-blank note. Asking for
        more changes directly after a `RESUBMITTED` version is allowed, so it does
        not need an extra accept step. The current version is required to reject
        stale writes; a stale write returns 409. A transition the actor's role cannot
        perform returns 403.
