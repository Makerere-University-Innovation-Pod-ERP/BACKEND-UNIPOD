      summary: Create a work order for a department
      description: |
        Any authenticated user can place an order. The authenticated subject becomes the customer and
        creator. The code is generated as `ORD-<DEPT>-<YEAR>-<6-digit sequence>`, the initial stage is
        `NEW`, and the first stage-history entry is recorded.
      parameters:
