          format: date-time
    ReviewersPanelResponse:
      type: object
      required: [briefId, configured, round, mode, reviewsNeeded, dueDate, version, quorum, reviewers]
      properties:
        briefId:
          type: string
          format: uuid
        configured:
          type: boolean
        round:
          type: [integer, 'null']
        mode:
          oneOf:
            - $ref: '#/components/schemas/ReviewMode'
            - type: 'null'
        reviewsNeeded:
          type: [integer, 'null']
        dueDate:
          type: [string, 'null']
          format: date
        version:
          type: [integer, 'null']
          format: int64
        quorum:
          $ref: '#/components/schemas/ReviewQuorumSummary'
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/ReviewPanelReviewer'
    ReviewPanelReviewer:
      type: object
      required: [reviewerId, department, position, status, assignedBy, decision, submittedAt]
      properties:
        reviewerId:
          type: string
        department:
          type: [string, 'null']
        position:
          type: integer
        status:
          $ref: '#/components/schemas/ReviewAssignmentStatus'
        assignedBy:
          type: string
        decision:
          oneOf:
            - $ref: '#/components/schemas/ReviewDecision'
            - type: 'null'
        submittedAt:
          type: [string, 'null']
          format: date-time
    SaveReviewSettingsRequest:
      type: object
      required: [mode, reviewsNeeded]
      description: Omit version when creating round one; include the current version when updating. Unknown properties are ignored, including server-owned round and setBy.
      properties:
        mode:
          $ref: '#/components/schemas/ReviewMode'
        reviewsNeeded:
          type: integer
          minimum: 1
          maximum: 20
        dueDate:
          type: [string, 'null']
          format: date
        version:
          type: [integer, 'null']
          format: int64
          minimum: 0
    AssignReviewerRequest:
      type: object
      additionalProperties: false
      required: [reviewerId]
      description: reviewerId must be the email of an active reviewer account. Server-owned fields round, position, status, and assignedBy are ignored.
      properties:
        reviewerId:
          type: string
          minLength: 1
          description: The reviewer's account email
        department:
          type: [string, 'null']
          maxLength: 100
    CoordinatorReviewsResponse:
      type: object
      required: [briefId, configured, round, mode, reviewsNeeded, dueDate, latestRound, quorum, reviews, notSubmittedCount]
      properties:
        briefId:
          type: string
          format: uuid
        configured:
          type: boolean
        round:
          type: [integer, 'null']
        mode:
          oneOf:
            - $ref: '#/components/schemas/ReviewMode'
            - type: 'null'
        reviewsNeeded:
          type: [integer, 'null']
        dueDate:
          type: [string, 'null']
          format: date
        latestRound:
          type: [integer, 'null']
        quorum:
          $ref: '#/components/schemas/ReviewQuorumSummary'
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/CoordinatorReviewItem'
        notSubmittedCount:
          type: integer
    CoordinatorReviewItem:
      type: object
      required: [reviewerId, department, position, decision, comment, submittedAt, followUpNotes]
      properties:
        reviewerId:
          type: string
        department:
          type: [string, 'null']
        position:
          type: integer
        decision:
          $ref: '#/components/schemas/ReviewDecision'
        comment:
          type: string
        submittedAt:
          type: string
          format: date-time
        followUpNotes:
          type: array
          items:
            $ref: '#/components/schemas/FollowUpNoteResponse'
    ReviewQueueResponse:
      type: object
      required: [assignedToMe, waitingForMyReview, rows]
      properties:
        assignedToMe:
          type: integer
          format: int64
          description: Number of rows assigned to the caller across all pages
        waitingForMyReview:
          type: integer
          format: int64
          description: Number of assigned rows the caller can still submit
        rows:
          $ref: '#/components/schemas/ReviewQueuePage'
    ReviewQueuePage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueRow'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ReviewQueueRow:
      type: object
      required: [briefId, title, trackingReference, briefType, round, position, dueDate, status, stage, canSubmit]
      properties:
        briefId:
          type: string
          format: uuid
        title:
          type: string
        trackingReference:
          type: [string, 'null']
          description: The brief's code, or null until it has one
        briefType:
          type: string
          enum: [student, general, service_request]
        round:
          type: integer
        position:
          type: integer
        dueDate:
          type: [string, 'null']
          format: date
        status:
          $ref: '#/components/schemas/ReviewAssignmentStatus'
        stage:
          $ref: '#/components/schemas/SubmissionStage'
        canSubmit:
          type: boolean
  responses:
    ValidationFailed:
      description: One or more request values are invalid. The body lists each field in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Malformed request (broken JSON, wrong parameter type, missing parameter)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: A valid bearer token is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated user lacks a role allowed by this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state or version of the resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The payload is valid JSON but cannot be processed in its current form
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error. The response includes a support reference but no internal details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
