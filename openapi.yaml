      x-required-roles: [ADMINISTRATOR, DEPARTMENT_COORDINATOR]
      summary: Book the Telecoms lab
      description: |
        Books the Telecoms department's facility and confirms it at once. The clash rules of `/bookings` apply:
        another booking or a timetable block at that time, or a facility under maintenance, is `409`; a group
