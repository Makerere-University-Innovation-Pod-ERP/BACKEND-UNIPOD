  /cases/{id}/transitions:
    post:
      tags: [Case Files]
      operationId: transitionCase
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, FACT_FINDING_OFFICER]
      summary: Move a case to its next allowed stage
      description: |
        Administrator and Innovation Coordinator may perform any valid canonical
        transition. A Fact-Finding Officer may start fact-finding
        (`IN_FACT_FINDING`) from a `FORWARDED` case, then move an
        `IN_FACT_FINDING` case only to `READY_FOR_REVIEW` or
        `IMPROVEMENT_REQUESTED`. Moving to `READY_FOR_REVIEW` or `IN_REVIEW`
        from fact-finding requires a completed fact-finding check (FR-008).
        A coordinator may accept a `RESUBMITTED` version by moving it to
        `IN_REVIEW` without repeating fact-finding, or request further
        improvements directly. Moving to `IMPROVEMENT_REQUESTED` requires a
        guidance note, due date, and at least one requested change; this creates
        the refinement request in the same transaction. The current version is
        required to reject stale writes; a stale write returns 409. A transition
        the actor's role cannot perform returns 403.
