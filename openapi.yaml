          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        reference:
          type: string
          description: Support reference included for unexpected server errors.
        code:
          type: string
          description: |
            Machine-readable reason, present on every error. Generic codes come from the
            status (INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT,
            VALIDATION_FAILED, INTERNAL_ERROR, ...). Specific ones include
            ROLE_NOT_PERMITTED, NOT_OWNER, NOT_ASSIGNED, OUTSIDE_DEPARTMENT, MALFORMED_BODY,
            MISSING_PARAMETER, INVALID_PARAMETER, SUBMISSION_INVALID, SUBMISSION_NOT_FOUND,
            SUBMISSION_CONFLICT, SECTOR_NOT_FOUND, SECTOR_CONFLICT, DOCUMENT_NOT_FOUND,
            NOTIFICATION_NOT_FOUND.
        errors:
          type: array
          description: Present on 422 responses. One entry per invalid field.
          items:
            $ref: '#/components/schemas/FieldError'
