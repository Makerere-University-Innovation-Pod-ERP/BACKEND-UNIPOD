        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/PartnerType'
        renewalDate:
          type: [string, 'null']
          format: date
          description: Between 1900 and 2999
        contactPerson:
          type: [string, 'null']
          maxLength: 255
        contactEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        notes:
          type: [string, 'null']
          maxLength: 2000
    UpdatePartnerRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: Only `version` is required. A field that is left out, or sent as `null`, is not changed.
      properties:
        version:
          type: integer
          format: int64
        name:
          type: [string, 'null']
          maxLength: 255
          description: Must not be blank when present
        type:
          oneOf:
            - $ref: '#/components/schemas/PartnerType'
            - type: 'null'
        renewalDate:
          type: [string, 'null']
          format: date
          description: Replaces the current date (between 1900 and 2999). It cannot be cleared.
        contactPerson:
          type: [string, 'null']
          maxLength: 255
          description: An empty string clears it
        contactEmail:
          description: An email address, or an empty string to clear it
          anyOf:
            - type: string
              format: email
              maxLength: 254
            - type: string
              maxLength: 0
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
          description: An empty string clears it
