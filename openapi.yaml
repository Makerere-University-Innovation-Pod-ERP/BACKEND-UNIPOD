    post:
      tags: [Training]
      operationId: bulkPassTrainingAttendance
      x-required-roles: [ADMINISTRATOR, DEPARTMENT_COORDINATOR]
      summary: Mark safety-course participants as passed in bulk
      description: |
        Only safety courses can record a pass. Participant ids or user ids in `userIds` are matched
        against the session; only CONFIRMED participants are changed, and their attendance becomes
        `PRESENT`. Each newly confirmed pass also grants CNC machine-booking eligibility when it is
        not already present, counted in `eligible_unlocked_count`.
      parameters:
        - name: id
          in: path
          required: true
          description: The training session id
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAttendancePassRequest'
      responses:
        '200':
          description: The pass count and newly unlocked eligibility count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAttendancePassResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
