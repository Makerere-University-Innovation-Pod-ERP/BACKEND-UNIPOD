  /submissions/{id}/documents/upload:
    post:
      tags: [Submissions]
      operationId: uploadSubmissionDocument
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, RECEPTIONIST, FACT_FINDING_OFFICER, SUBMITTER]
      summary: Upload a document file
      description: |
        Stores the file in configured object storage, or in Postgres when object storage is
        disabled. Files are limited to 15 MB (15,728,640 bytes); oversized files return `413`.
        Accepted content types are PDF, Word, Excel, PowerPoint, RTF, ZIP, plain text, CSV,
        JPEG, PNG, GIF, WebP, or TIFF images, and the design formats DXF, DWG, STL, and SVG
        (an allowed file extension is accepted when the browser reports
        `application/octet-stream`); anything else returns `400`. Each upload receives
        the next per-type `version` and resolves a matching open document request.
        `documentType` defaults to `OTHER` when omitted. Submitters may upload only while their
        brief is `DRAFT`, `SUBMITTED`, or `AWAITING_INFORMATION`.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, status, file]
              properties:
                name:
                  type: string
                  maxLength: 255
                status:
                  $ref: '#/components/schemas/DocumentStatus'
                documentType:
                  allOf:
                    - $ref: '#/components/schemas/DocumentType'
                  default: OTHER
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document metadata and generated opaque storage reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '413':
          description: Uploaded file exceeds the configured size limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
