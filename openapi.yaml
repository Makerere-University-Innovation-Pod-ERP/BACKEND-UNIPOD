  /departments/{dept}/orders/{id}/stage:
    patch:
      tags: [Operations]
      operationId: changeDepartmentOrderStage
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, DEPARTMENT_COORDINATOR, SECTOR_OFFICER]
      summary: Move a department work order to another stage
      description: |
        Stages are department-specific: Multimedia uses `NEW, QUOTED, PAYMENT_GATE, SCHEDULED,
        IN_PRODUCTION, READY, DELIVERED, COMPLETED`; Textile uses `NEW, QUOTED, PAYMENT_GATE,
        SCHEDULED, CUTTING, SEWING, QC, READY, COLLECTED`; CNC uses `NEW, QUOTED, PAYMENT_GATE,
        SCHEDULED, IN_PRODUCTION, READY, COLLECTED`; Telecoms uses `NEW, QUOTED, PAYMENT_GATE,
        SCHEDULED, IN_PROGRESS, READY, DONE`. Stages are case-insensitive and spaces or hyphens are
        normalised to underscores. Moving backwards returns `409 INVALID_STAGE_TRANSITION`; entering
        any scheduled-or-later stage without a paid invoice returns `409 PAYMENT_REQUIRED`. First
        entry into a completion stage deducts `materialsUsed` from stock; insufficient stock is `409
        STOCK_INSUFFICIENT`.
      parameters:
        - name: dept
          in: path
          required: true
          description: Department code. Accepts `multimedia`/`media`, `textile`/`textiles`, `cnc`, or `telecoms`/`telecom`/`telecom_lab`, case-insensitively.
          schema:
            type: string
            example: telecoms
        - name: id
          in: path
          required: true
          description: The order id
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentOrderStageRequest'
      responses:
        '200':
          description: The updated order
