        '200':
          description: The partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Partner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Partners]
      operationId: createPartner
      x-required-roles: [ADMINISTRATOR, DEPARTMENT_COORDINATOR]
      summary: Add a partner
      description: |
        Names are unique ignoring case and surrounding spaces; a second partner with the same name
        returns `409`. Blank contact fields are stored as no value (`null`). The change is written to the audit
        log as `partner.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartnerRequest'
      responses:
        '201':
          description: The new partner (`version` is 0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
