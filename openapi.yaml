  /operations/partners/{id}:
    patch:
      tags: [Partners]
      operationId: updatePartner
      x-required-roles: [ADMINISTRATOR, DEPARTMENT_COORDINATOR]
      summary: Change a partner's details
      description: |
        Send the `version` you last read plus only the fields you want to change; an omitted or
        `null` field is left as it is. An empty string clears `contactPerson`, `contactEmail` or
        `notes`. A blank `name` is refused with `422` and a field error naming `name`, the same as
        on create. `renewalDate` can be replaced but not cleared. A stale `version`, or a `name`
        already used by another partner, returns `409`. A PATCH that changes nothing is a no-op:
        the `version` stays as it was and no audit entry is written. A different `renewalDate`
        starts the warning cycle again, so its next warning is announced even if one was already
        sent for the old date. Recorded in the audit log as `partner.updated`; contact details
        and notes are never copied into it, only whether they changed.
      parameters:
        - $ref: '#/components/parameters/PartnerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartnerRequest'
      responses:
        '200':
          description: The partner after the change, with its new `version`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
