openapi: 3.1.0
info:
  title: Makerere Innovation Hub ERP API
  version: 1.0.0
  description: |
    Waluube intake and case workflow contract. A submission is first saved as a
    draft, registered as received, assigned to a sector, and advanced through
    the pipeline. Student evidence is conditionally required at registration;
    general-public cases must not include student-specific fields.
servers:
  - url: /api
    description: API context path
security:
  - bearerAuth: []
tags:
  - name: Submissions
    description: Intake and registration
  - name: Reception
    description: Reception work queue
  - name: Dashboard
    description: Pipeline overview metrics
  - name: Sectors
    description: Sector catalog and routing
paths:
  /submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      summary: Create an intake draft
      description: |
        Available to Administrator, Innovation Coordinator, Receptionist, and
        Fact-Finding Officer. The authenticated principal is recorded as
        registeredBy. This operation does not allocate a case code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
            examples:
              student:
                value:
                  category: student
                  title: Low-cost irrigation monitor
                  purpose: Prototype a low-cost monitor for small farms
                  problemAddressed: Farmers lack timely soil-moisture information
                  studentNumber: "2026001234"
                  programme: Agricultural Engineering
                  supervisor: Dr Example
                  recommendationLetterStatus: submitted
              general:
                value:
                  category: general
                  title: Community solar charging point
                  purpose: Explore a shared charging point
                  problemAddressed: Limited access to reliable charging
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Submissions]
      operationId: listSubmissions
      summary: List all submissions
      description: Results are role-scoped, filtered, paginated, and stably ordered by received date then id.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: category
          in: query
          schema:
            type: string
            enum: [student, general]
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/SubmissionStage'
        - name: sector
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Case-insensitive title substring.
          schema:
            type: string
      responses:
        '200':
          description: A page of submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/search:
    get:
      tags: [Submissions]
      operationId: searchSubmissions
      summary: Search submissions by exact code or title
      description: Exact case-code matches are returned first; otherwise code is treated as a title substring.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Matching submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/mine:
    get:
      tags: [Submissions]
      operationId: listMySubmissions
      summary: List submissions created by the authenticated user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of the caller's submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/{id}/register:
    post:
      tags: [Submissions]
      operationId: registerSubmission
      summary: Register a submission as received
      description: |
        Available to Administrator, Innovation Coordinator, Receptionist, and
        Fact-Finding Officer. Allocates a unique STU-{year}-{sequence} or
        GEN-{year}-{sequence} code atomically. Student number, programme,
        supervisor, and recommendation-letter status must be present for
        student submissions. A submission can be registered only once.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Submission registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/{id}/reviewer:
    put:
      tags: [Submissions]
      operationId: assignSubmissionReviewer
      summary: Assign or clear a reviewer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentRequest'
      responses:
        '200':
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /submissions/{id}:
    get:
      tags: [Submissions]
      operationId: getCaseFile
      summary: Get the case file, documents, and stage history
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Case file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /submissions/{id}/forward:
    post:
      tags: [Submissions]
      operationId: forwardSubmission
      summary: Assign a received submission to a sector
      description: Stores the sector UUID as an opaque reference and writes a durable submission.forwarded outbox event in the same transaction. Notification delivery requires a downstream worker.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardSubmissionRequest'
      responses:
        '200':
          description: Submission forwarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/transition:
    post:
      tags: [Submissions]
      operationId: advanceSubmission
      summary: Advance a forwarded submission through the pipeline
      description: Only FORWARDED to IN_PROGRESS and IN_PROGRESS to COMPLETED are allowed. Backward transitions and skipped stages are rejected.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceSubmissionRequest'
      responses:
        '200':
          description: Submission advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/documents:
    post:
      tags: [Submissions]
      operationId: addSubmissionDocument
      summary: Add document metadata to a case
      description: Accepts an opaque storage reference, not a URL, filesystem path, or file bytes. File storage is provided by an external storage integration.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document metadata created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{id}/documents/upload:
    post:
      tags: [Submissions]
      operationId: uploadSubmissionDocument
      summary: Upload a document to configured S3-compatible storage
      description: Available only when S3 storage is enabled. Files are limited by the configured server-side upload limit.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, status, file]
              properties:
                name:
                  type: string
                  maxLength: 255
                status:
                  $ref: '#/components/schemas/DocumentStatus'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document metadata and generated opaque storage reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: Uploaded file exceeds the configured size limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /submissions/{id}/documents/{documentId}/file:
    get:
      tags: [Submissions]
      operationId: downloadSubmissionDocument
      summary: Download a case document
      description: The response is always an attachment with an octet-stream content type and nosniff protection.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document bytes
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /sectors:
    get:
      tags: [Sectors]
      operationId: listActiveSectors
      summary: List active sectors
      responses:
        '200':
          description: Active sectors ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sector'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Sectors]
      operationId: createSector
      summary: Create a sector
      description: Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorRequest'
      responses:
        '201':
          description: Sector created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sector'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /sectors/catalog:
    get:
      tags: [Sectors]
      operationId: listAllSectors
      summary: List active and inactive sectors
      description: Administrator only; use this list to reactivate a deactivated sector.
      responses:
        '200':
          description: All sectors ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sector'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sectors/{id}:
    put:
      tags: [Sectors]
      operationId: updateSector
      summary: Update or deactivate a sector
      description: Administrator only. Deactivation is soft; existing cases retain their sector reference.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorRequest'
      responses:
        '200':
          description: Updated sector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sector'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sectors/{id}/members:
    get:
      tags: [Sectors]
      operationId: listSectorMembers
      summary: List sector officer subjects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sector officer subject identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Sectors]
      operationId: addSectorMember
      summary: Add a sector officer subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorMemberRequest'
      responses:
        '200':
          description: Added subject identifier
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sectors]
      operationId: removeSectorMember
      summary: Remove a sector officer subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subject
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /queues/reception:
    get:
      tags: [Reception]
      operationId: getReceptionQueue
      summary: Get draft reception queue and queue counters
      description: The queue contains DRAFT submissions. Awaiting action counts RECEIVED submissions; recently updated counts all submissions updated in the last 14 days.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Reception queue page and counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionQueue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dashboard/overview:
    get:
      tags: [Dashboard]
      operationId: getDashboardOverview
      summary: Get pipeline overview metrics
      responses:
        '200':
          description: Pipeline counts by stage and category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SubmissionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateSubmissionRequest:
      type: object
      additionalProperties: false
      required: [category, title, purpose, problemAddressed]
      properties:
        category:
          type: string
          enum: [student, general]
        title:
          type: string
          minLength: 1
          maxLength: 240
        purpose:
          type: string
          minLength: 1
          maxLength: 5000
        problemAddressed:
          type: string
          minLength: 1
          maxLength: 5000
        studentNumber:
          type: string
          maxLength: 80
        programme:
          type: string
          maxLength: 200
        supervisor:
          type: string
          maxLength: 255
        recommendationLetterStatus:
          $ref: '#/components/schemas/RecommendationLetterStatus'
      allOf:
        - if:
            properties:
              category:
                const: general
          then:
            not:
              anyOf:
                - required: [studentNumber]
                - required: [programme]
                - required: [supervisor]
                - required: [recommendationLetterStatus]
    RecommendationLetterStatus:
      type: string
      enum: [verified, submitted, one_file, not_required]
    SubmissionStage:
      type: string
      enum: [DRAFT, RECEIVED, FORWARDED, IN_PROGRESS, COMPLETED]
    DocumentStatus:
      type: string
      enum: [VERIFIED, SUBMITTED, ONE_FILE, NOT_REQUIRED]
    ForwardSubmissionRequest:
      type: object
      additionalProperties: false
      required: [sectorId]
      properties:
        sectorId:
          type: string
          format: uuid
    AdvanceSubmissionRequest:
      type: object
      additionalProperties: false
      required: [stage]
      properties:
        stage:
          type: string
          enum: [IN_PROGRESS, COMPLETED]
    CreateDocumentRequest:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileReference:
          type: [string, 'null']
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
    SubmissionDocument:
      type: object
      required: [id, submissionId, name, status, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileReference:
          type: [string, 'null']
        contentType:
          type: [string, 'null']
        fileSize:
          type: [integer, 'null']
          format: int64
        originalFilename:
          type: [string, 'null']
          maxLength: 255
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    SectorRequest:
      type: object
      additionalProperties: false
      required: [name, notificationEmail, active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        notificationEmail:
          type: string
          format: email
          maxLength: 320
        active:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
          description: Expected sector version for updates; omit when creating a sector.
    Sector:
      allOf:
        - $ref: '#/components/schemas/SectorRequest'
        - type: object
          required: [id, version, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ReviewerAssignmentRequest:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: [string, 'null']
          maxLength: 255
    SectorMemberRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
    SubmissionPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Submission'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ReceptionQueue:
      allOf:
        - $ref: '#/components/schemas/SubmissionPage'
        - type: object
          required: [inQueueCount, awaitingActionCount, recentlyUpdatedCount]
          properties:
            inQueueCount:
              type: integer
              format: int64
            awaitingActionCount:
              type: integer
              format: int64
            recentlyUpdatedCount:
              type: integer
              format: int64
    CaseStageHistory:
      type: object
      required: [id, toStage, changedBy, changedAt]
      properties:
        id:
          type: string
          format: uuid
        fromStage:
          oneOf:
            - $ref: '#/components/schemas/SubmissionStage'
            - type: 'null'
        toStage:
          $ref: '#/components/schemas/SubmissionStage'
        changedBy:
          type: string
        changedAt:
          type: string
          format: date-time
    CaseFile:
      type: object
      required: [submission, documents, stageHistory]
      properties:
        submission:
          $ref: '#/components/schemas/Submission'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionDocument'
        stageHistory:
          type: array
          items:
            $ref: '#/components/schemas/CaseStageHistory'
    DashboardOverview:
      type: object
      required: [totalSubmissions, byStage, studentSubmissions, generalSubmissions, awaitingActionCount, forwardedCount, completedCount, recentlyUpdatedCount]
      properties:
        totalSubmissions:
          type: integer
          format: int64
        byStage:
          type: object
          additionalProperties:
            type: integer
            format: int64
        studentSubmissions:
          type: integer
          format: int64
        generalSubmissions:
          type: integer
          format: int64
        awaitingActionCount:
          type: integer
          format: int64
        forwardedCount:
          type: integer
          format: int64
        completedCount:
          type: integer
          format: int64
        recentlyUpdatedCount:
          type: integer
          format: int64
    Submission:
      type: object
      required: [id, category, title, purpose, problemAddressed, registeredBy, stage, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: [string, 'null']
          pattern: '^(STU|GEN)-[0-9]{4}-[0-9]{6,19}$'
        category:
          type: string
          enum: [student, general]
        title:
          type: string
        purpose:
          type: string
        problemAddressed:
          type: string
        registeredBy:
          type: string
        receivingOfficer:
          type: [string, 'null']
        assignedReviewerSubject:
          type: [string, 'null']
        studentNumber:
          type: [string, 'null']
        programme:
          type: [string, 'null']
        supervisor:
          type: [string, 'null']
        recommendationLetterStatus:
          oneOf:
            - $ref: '#/components/schemas/RecommendationLetterStatus'
            - type: 'null'
        responsibleSectorId:
          type: [string, 'null']
          format: uuid
        responsibleSectorName:
          type: [string, 'null']
        stage:
          $ref: '#/components/schemas/SubmissionStage'
        receivedAt:
          type: [string, 'null']
          format: date-time
        forwardedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        reference:
          type: string
          description: Support reference included for unexpected server errors.
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: A valid bearer token is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated user lacks an allowed intake role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Submission does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Submission has already been registered
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error. The response includes a support reference but no internal details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
