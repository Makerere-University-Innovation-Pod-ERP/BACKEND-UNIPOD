      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, DEPARTMENT_COORDINATOR, SECTOR_OFFICER]
      summary: Approve or decline an equipment allocation
      description: |
        Decides a PENDING allocation. `APPROVED` (or `DECLINED`/`REJECTED` to refuse) is case-insensitive.
        A decline requires a non-blank `note`, which becomes the rejection reason. Approving re-checks
        facility maintenance, machine eligibility and conflicts; equipment allocations move to `OUT`
        with `conditionOut` set to `WORKING`, while facility bookings move to `APPROVED`. A booking
        that is no longer PENDING returns `409`.
      parameters:
        - name: id
          in: path
          required: true
          description: The allocation id
          schema:
