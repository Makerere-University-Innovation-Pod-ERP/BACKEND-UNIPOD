      operationId: transitionMediaContract
      x-required-roles: [ADMINISTRATOR, INNOVATION_COORDINATOR, DEPARTMENT_COORDINATOR, SECTOR_OFFICER]
      summary: Move a media contract to another status
      description: |
        Allowed transitions are `DRAFT` to `SIGNED` or `CANCELLED`, `SIGNED` to `IN_PROGRESS` or
        `CANCELLED`, and `IN_PROGRESS` to `COMPLETED` or `CANCELLED`; anything else is `409
        INVALID_CONTRACT_TRANSITION`. Moving to `SIGNED` requires a signed document. Supplying
        `signed_contract_doc_id` on any other transition is rejected with `422`. Concurrent edits
        return `409 EDIT_CONFLICT`.
      parameters:
        - name: id
          in: path
          required: true
          description: The contract id
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaContractStatusRequest'
      responses:
        '200':
          description: The updated contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaContract'
        '400':
