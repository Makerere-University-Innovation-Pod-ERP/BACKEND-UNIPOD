          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SubmissionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartnerId:
      name: id
      in: path
      required: true
      description: The partner's id
      schema:
        type: string
        format: uuid
    EquipmentId:
      name: id
      in: path
      required: true
      description: The equipment item's id
      schema:
        type: string
        format: uuid
    LoanId:
      name: id
      in: path
      required: true
      description: The loan reference, for example `LOAN-000012`
      schema:
        type: string
    MachineId:
      name: id
      in: path
      required: true
      description: The machine's id
      schema:
        type: string
        format: uuid
    StockItemId:
      name: id
      in: path
      required: true
      description: The stock item's id
      schema:
        type: string
        format: uuid
    ReviewerId:
      name: reviewerId
      in: path
      required: true
      description: The reviewer's account email
      schema:
        type: string
  schemas:
    TrainingOverview:
      type: object
      required: [upcomingSessions, seatsFilled, totalSeats, mentorshipFollowUps, sessions, followUps]
      properties:
        upcomingSessions:
          type: integer
          format: int64
          description: Sessions that are UPCOMING
        seatsFilled:
          type: integer
          format: int64
          description: Seats held across UPCOMING and IN_PROGRESS sessions
        totalSeats:
          type: integer
          format: int64
          description: Capacity across UPCOMING and IN_PROGRESS sessions
        mentorshipFollowUps:
          type: integer
          format: int64
          description: Follow-ups that are not COMPLETED
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TrainingSession'
        followUps:
          type: array
          items:
            $ref: '#/components/schemas/MentorshipFollowUp'
    TrainingSession:
      type: object
      required: [id, title, facilitator, date, enrolledCount, capacity, venue, status, description, participants, departmentId, endsAt, fee, safetyCourse, published]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        facilitator:
          type: string
        date:
          type: string
          format: date-time
          description: Start time, ISO-8601 with the Kampala offset, for example 2026-10-29T09:00:00+03:00
        enrolledCount:
          type: integer
          description: Participants holding a seat (PENDING_PAYMENT or CONFIRMED)
        capacity:
          type: integer
        venue:
          type: string
        status:
          $ref: '#/components/schemas/TrainingSessionStatus'
        description:
          type: string
        participants:
          type: array
          description: Participants holding a seat, in registration order; removed registrations are not listed
          items:
            $ref: '#/components/schemas/TrainingParticipant'
        departmentId:
          type: string
          format: uuid
        endsAt:
          type: string
          format: date-time
        fee:
          type: integer
          description: Whole UGX; 0 for a free session
        safetyCourse:
          type: boolean
        published:
          type: boolean
    TrainingSessionStatus:
      type: string
      description: DRAFT when not published; otherwise UPCOMING before the start, IN_PROGRESS until the end, then COMPLETED
      enum: [DRAFT, UPCOMING, IN_PROGRESS, COMPLETED]
    TrainingParticipant:
      type: object
      required: [id, name, regNumber, department, contactEmail, status, attendance, passed, registeredAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        regNumber:
          type: string
        department:
          type: string
          description: The participant's own department as free text
        contactEmail:
          type: [string, 'null']
        status:
          type: string
          enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED]
        attendance:
          type: string
          enum: [PRESENT, ABSENT, EXCUSED, UNMARKED]
        passed:
          type: boolean
          description: Set only for safety courses
        registeredAt:
          type: string
          format: date-time
    CreateTrainingSessionRequest:
      type: object
      required: [title, facilitator, date, capacity, venue, departmentId]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        facilitator:
          type: string
          maxLength: 200
        date:
          type: string
          format: date-time
          description: Start time with an offset, for example 2026-10-29T09:00:00+03:00
        endsAt:
          type: string
          format: date-time
          description: Defaults to two hours after `date`; must be later than `date`
        capacity:
          type: integer
          minimum: 1
        venue:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        departmentId:
          type: string
          format: uuid
          description: An active department; the list is in `GET /config`
        fee:
          type: integer
          minimum: 0
          description: Whole UGX; defaults to 0 (free)
        safetyCourse:
          type: boolean
          description: Defaults to false
        publish:
          type: boolean
          description: Defaults to true; false creates a DRAFT
    RegisterTrainingParticipantRequest:
      type: object
      required: [name, regNumber, department]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
        regNumber:
          type: string
          maxLength: 50
          description: Unique per session among registrations that are not removed, ignoring case
        department:
          type: string
          maxLength: 200
        contactEmail:
          type: string
          format: email
          maxLength: 254
    RecordTrainingAttendanceRequest:
      type: object
      required: [participantId, attendance]
      additionalProperties: false
      properties:
        participantId:
          type: string
          format: uuid
        attendance:
          type: string
          enum: [PRESENT, ABSENT, EXCUSED, UNMARKED]
    MentorshipFollowUp:
      type: object
      required: [id, title, mentee, mentor, scheduledDate, focus, status, notes, priority, version]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        mentee:
          type: string
        mentor:
          type: string
        scheduledDate:
          type: string
          format: date
        focus:
          type: string
        status:
          $ref: '#/components/schemas/MentorshipFollowUpStatus'
        notes:
          type: string
        priority:
          type: string
          enum: [NORMAL, HIGH, URGENT]
        version:
          type: integer
          format: int64
          description: Send it back on the next update to be told if someone else changed the follow-up first
    MentorshipFollowUpStatus:
      type: string
      enum: [PENDING_FOLLOW_UP, ACTION_REQUIRED, SCHEDULED, COMPLETED]
    CreateMentorshipFollowUpRequest:
      type: object
      required: [title, mentee, mentor, scheduledDate, focus]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        mentee:
          type: string
          maxLength: 200
        mentor:
          type: string
          maxLength: 200
        scheduledDate:
          type: string
          format: date
        focus:
          type: string
          maxLength: 500
        priority:
          type: string
          enum: [NORMAL, HIGH, URGENT]
          description: Defaults to NORMAL
        notes:
          type: string
          maxLength: 2000
    UpdateMentorshipFollowUpRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/MentorshipFollowUpStatus'
        notes:
          type: string
          maxLength: 2000
          description: Omit to keep the current notes; blank text clears them
        version:
          type: integer
          format: int64
          minimum: 0
          description: |
            The `version` read with the follow-up. Optional; when sent and no longer current, the update is
            refused with 409 and nothing changes.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 128
    LoginResponse:
      type: object
      required: [tokenType, accessToken, expiresAt, mustChangePassword]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        mustChangePassword:
          type: boolean
          description: |
            True when the account was created through assisted submission and
            still uses its one-time temporary password.
        refreshToken:
          type: string
          description: Single-use token for `POST /auth/refresh` and `POST /auth/logout`. Store it securely.
        refreshExpiresAt:
          type: string
          format: date-time
    AccountKind:
      type: string
      enum: [STUDENT, PUBLIC, ORGANISATION]
    Me:
      type: object
      required: [id, email, role, mustChangePassword, homeScreen, departmentIds, capabilities]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/ApiUserRole'
        mustChangePassword:
          type: boolean
        homeScreen:
          type: string
          enum: [MY_SUBMISSIONS, STAFF_HOME]
        departmentIds:
          type: array
          items:
            type: string
            format: uuid
        profile:
          oneOf:
            - $ref: '#/components/schemas/UserProfile'
            - type: 'null'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
    UserProfile:
      type: object
      required: [accountKind, fullName, phone, rulesVersion]
      properties:
        accountKind:
          $ref: '#/components/schemas/AccountKind'
        fullName:
          type: string
        displayFirstName:
          type: [string, 'null']
        phone:
          type: string
        studentNumber:
          type: [string, 'null']
        course:
          type: [string, 'null']
        universityEmail:
          type: [string, 'null']
        organisationName:
          type: [string, 'null']
        contactPerson:
          type: [string, 'null']
        mouReference:
          type: [string, 'null']
        rulesVersion:
          type: string
    Capability:
      type: object
      required: [action, scope]
      properties:
        action:
          type: string
          enum: [CASE_VIEW, CASE_EDIT, CASE_FORWARD, CASE_ASSIGN_REVIEWER, CASE_REVIEW, CASE_DECIDE, AUDIT_VIEW, USER_MANAGE, PRICE_LIST_MANAGE, PRICE_LIST_PROPOSE, REPORT_VIEW]
        scope:
          type: string
          enum: [OWN, ASSIGNED, DEPARTMENT, ALL]
    UserSummary:
      type: object
      required: [id, email, role, active, departmentIds, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/ApiUserRole'
        active:
          type: boolean
        departmentIds:
          type: array
          items:
            type: string
            format: uuid
        profile:
          oneOf:
            - $ref: '#/components/schemas/UserProfile'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserSummaryPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    UpdateUserRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/ApiUserRole'
        departmentIds:
          type: array
          items:
            type: string
            format: uuid
    Role:
      type: object
      required: [role, staff]
      properties:
        role:
          $ref: '#/components/schemas/ApiUserRole'
        staff:
          type: boolean
    PriceUnit:
      type: string
      enum: [PER_SESSION, PER_ITEM, PER_HOUR, PER_DAY]
    PriceItemStatus:
      type: string
      enum: [PROPOSED, ACTIVE, RETIRED]
    InvoiceFromPriceRequest:
      type: object
      required: [customerEmail, sourceType]
      properties:
        customerEmail:
          type: string
          format: email
          maxLength: 254
        customerName:
          type: string
          maxLength: 255
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        sourceType:
          type: string
          enum: [REQUEST, BOOKING, SESSION, JOB]
        sourceId:
          type: string
          maxLength: 64
    PriceListItemRequest:
      type: object
      required: [departmentId, service, unit, priceUgx]
      properties:
        departmentId:
          type: string
          format: uuid
        service:
          type: string
          maxLength: 200
        unit:
          $ref: '#/components/schemas/PriceUnit'
        priceUgx:
          type: integer
          format: int64
          minimum: 1
        effectiveFrom:
          type: string
          format: date
    PriceListItemUpdateRequest:
      type: object
      properties:
        service:
          type: string
          minLength: 1
          maxLength: 200
        unit:
          $ref: '#/components/schemas/PriceUnit'
        priceUgx:
          type: integer
          format: int64
          minimum: 1
        effectiveFrom:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/PriceItemStatus'
    PriceListItem:
      type: object
      required: [id, departmentId, service, unit, priceUgx, effectiveFrom, status, proposedBy, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        service:
          type: string
        unit:
          $ref: '#/components/schemas/PriceUnit'
        priceUgx:
          type: integer
          format: int64
        effectiveFrom:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/PriceItemStatus'
        proposedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    StageCountsReport:
      type: object
      required: [total, drafts, byStage]
      properties:
        total:
          description: Briefs that left draft, the same rule as the managers' Overview.
          type: integer
          format: int64
        drafts:
          type: integer
          format: int64
        byStage:
          type: object
          additionalProperties:
            type: integer
            format: int64
    StudentVsPublicReport:
      type: object
      required: [student, general, serviceRequests, total]
      description: Counts briefs that left draft.
      properties:
        student:
          type: integer
          format: int64
        general:
          type: integer
          format: int64
        serviceRequests:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    CompletionRateReport:
      type: object
      required: [submitted, completed, closed, completionRate, closedRate]
      properties:
        submitted:
          type: integer
          format: int64
        completed:
          type: integer
          format: int64
        closed:
          description: Completed or closed.
          type: integer
          format: int64
        completionRate:
          type: number
        closedRate:
          type: number
    IncomeTrendReport:
      type: object
      required: [weeks, totalUgx, series]
      properties:
        weeks:
          type: integer
        totalUgx:
          type: integer
          format: int64
        series:
          type: array
          items:
            type: object
            required: [weekStart, incomeUgx]
            properties:
              weekStart:
                type: string
                format: date
              incomeUgx:
                type: integer
                format: int64
    DepartmentWorkloadReport:
      type: object
      required: [departments]
      properties:
        departments:
          type: array
          items:
            type: object
            required: [departmentId, departmentName, openCases, openInvoices]
            properties:
              departmentId:
                type: string
                format: uuid
              departmentName:
                type: string
              openCases:
                type: integer
                format: int64
              openInvoices:
                type: integer
                format: int64
    ExportRequest:
      type: object
      required: [report, format]
      properties:
        report:
          type: string
          enum: [SUBMISSIONS_BY_STAGE, STUDENT_VS_PUBLIC, COMPLETION_RATE, INCOME_TREND, DEPARTMENT_WORKLOAD]
        format:
          type: string
          enum: [CSV, PDF]
        weeks:
          type: integer
          minimum: 1
          maximum: 52
          description: For INCOME_TREND only; default 12.
    Export:
      type: object
      required: [id, report, format, fileName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        report:
          type: string
        format:
          type: string
        fileName:
          type: string
        createdAt:
          type: string
          format: date-time
    SignupRequest:
      type: object
      required: [accountKind, fullName, phone, email, password, rulesAccepted, rulesVersion]
      properties:
        accountKind:
          $ref: '#/components/schemas/AccountKind'
        fullName:
          type: string
          maxLength: 200
        displayFirstName:
          type: string
          maxLength: 80
          description: Name used in greetings, kept apart from titles in fullName.
        phone:
          type: string
          pattern: '^\+?[0-9 ()-]{7,20}$'
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        studentNumber:
          type: string
          maxLength: 40
          description: Required for STUDENT. Unique.
        course:
          type: string
          maxLength: 200
          description: Required for STUDENT.
        universityEmail:
          type: string
          format: email
          maxLength: 254
          description: Required for STUDENT.
        organisationName:
          type: string
          maxLength: 200
          description: Required for ORGANISATION.
        contactPerson:
          type: string
          maxLength: 200
        mouReference:
          type: string
          maxLength: 100
        rulesAccepted:
          type: boolean
          description: Must be true.
        rulesVersion:
          type: string
          maxLength: 40
          description: Version of the UniPod general rules the user accepted.
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          maxLength: 256
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          maxLength: 72
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72
    CreateApiUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        role:
          $ref: '#/components/schemas/ApiUserRole'
    ApiUser:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/ApiUserRole'
        createdAt:
          type: string
          format: date-time
    ApiUserRole:
      type: string
      enum:
        - ADMINISTRATOR
        - INNOVATION_COORDINATOR
        - DEPARTMENT_COORDINATOR
        - RECEPTIONIST
        - FACT_FINDING_OFFICER
        - REVIEWER
        - SECTOR_OFFICER
        - IP_LIAISON
        - SUBMITTER
        - FINANCE_OFFICER
        - OBSERVER
    CreateSubmissionRequest:
      type: object
      additionalProperties: false
      required: [category, title, purpose, problemAddressed]
      properties:
        category:
          type: string
          enum: [student, general, service_request]
        title:
          type: string
          minLength: 1
          maxLength: 240
        purpose:
          type: string
          minLength: 1
          maxLength: 5000
        problemAddressed:
          type: string
          minLength: 1
          maxLength: 5000
        submitterId:
          type: [string, 'null']
          maxLength: 255
        submitterEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        submitterName:
          type: [string, 'null']
          maxLength: 255
        submitterPhone:
          type: [string, 'null']
          maxLength: 40
        studentNumber:
          type: string
          maxLength: 80
        programme:
          type: string
          maxLength: 200
        supervisor:
          type: string
          maxLength: 255
        recommendationLetterStatus:
          $ref: '#/components/schemas/RecommendationLetterStatus'
        serviceRequested:
          type: [string, 'null']
          maxLength: 255
          description: The service the requester needs (for example prototyping or testing).
        serviceRequester:
          oneOf:
            - $ref: '#/components/schemas/ServiceRequester'
            - type: 'null'
        department:
          type: [string, 'null']
          maxLength: 255
          description: Requesting department. A blank value is suggested from active sector names at submit time.
        expectedResult:
          type: [string, 'null']
          maxLength: 5000
          description: What the requester expects the hub to deliver.
        preferredAt:
          type: [string, 'null']
          format: date-time
          description: Preferred date and time for a service request. Required before the brief is registered or submitted.
        acceptedRulesVersion:
          type: [string, 'null']
          maxLength: 32
          description: Version of the intake rules the submitter accepted. Required before the brief is registered or submitted.
      allOf:
        - if:
            properties:
              category:
                const: general
          then:
            not:
              anyOf:
                - required: [studentNumber]
                - required: [programme]
                - required: [supervisor]
                - required: [recommendationLetterStatus]
                - required: [serviceRequested]
                - required: [serviceRequester]
                - required: [expectedResult]
    RequestInformationRequest:
      type: object
      additionalProperties: false
      description: |
        Provide `reason`, `items`, or both. The single `note` form remains
        supported for older clients and is used as the request summary when
        present. Each item becomes an open missing item.
      anyOf:
        - required: [note]
        - required: [reason]
        - required: [items]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
        reason:
          type: string
          minLength: 1
          maxLength: 255
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MissingItemRequest'
    RequestInfoAliasRequest:
      type: object
      additionalProperties: false
      description: |
        Frontend-shaped request for more information. Each entry in
        `missing_items` becomes an open missing item; `reason`, `due_date` and
        `message` are copied onto every item.
      properties:
        missing_items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            maxLength: 255
        reason:
          type: [string, 'null']
          maxLength: 255
        due_date:
          type: [string, 'null']
          format: date
        message:
          type: [string, 'null']
          maxLength: 2000
    ReceptionCheckItemKey:
      type: string
      enum:
        - DETAILS_COMPLETE
        - DOCUMENTS_COMPLETE
        - FILES_READABLE
        - CORRECT_TYPE
    ReceptionCheckItemRequest:
      type: object
      additionalProperties: false
      required: [key, checked]
      properties:
        key:
          $ref: '#/components/schemas/ReceptionCheckItemKey'
        checked:
          type: boolean
        note:
          type: string
          maxLength: 2000
    ReceptionCheckUpdateRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReceptionCheckItemRequest'
    ReceptionCheckLinesRequest:
      type: object
      additionalProperties: false
      description: |
        The four named reception verification lines. Every line is optional so
        progress can be saved, but at least one line must be supplied.
      properties:
        details_complete:
          $ref: '#/components/schemas/ReceptionCheckLine'
        documents_complete:
          $ref: '#/components/schemas/ReceptionCheckLine'
        files_readable:
          $ref: '#/components/schemas/ReceptionCheckLine'
        correct_type:
          $ref: '#/components/schemas/ReceptionCheckLine'
    ReceptionCheckLine:
      type: object
      additionalProperties: false
      required: [checked]
      properties:
        checked:
          type: boolean
        note:
          type: [string, 'null']
          maxLength: 2000
    ReceptionCheckItemResponse:
      type: object
      required: [key, label, checked]
      properties:
        key:
          $ref: '#/components/schemas/ReceptionCheckItemKey'
        label:
          type: string
        checked:
          type: boolean
        note:
          type: [string, 'null']
        checkedBy:
          type: [string, 'null']
        checkedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
    ReceptionCheckResponse:
      type: object
      required: [submissionId, complete, checkedCount, totalCount, items]
      properties:
