      x-required-roles: [SUBMITTER]
      summary: Upload the missing files and answer an information request
      description: |
        The owning submitter uploads one or more `files` (or a single `file`)
        together with an optional reply `note`. Each uploaded file must name the
        open requested item it answers through `documentItemIds`; a document
        item supplies the file's document type, an information item defaults it
