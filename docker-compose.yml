services:
  db:
    image: postgres:17-alpine
    container_name: unipod-db
    environment:
      POSTGRES_DB: makerere_hub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 on the host so it won't clash with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - unipod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d makerere_hub_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./UnipodERPBackend
    container_name: unipod-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/makerere_hub_db
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: local-docker-test-secret-key-change-me-32-chars-min
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  unipod_db_data:
