name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          echo "diff_size=$(wc -c < diff.txt)" >> $GITHUB_OUTPUT

      - name: Review with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s diff.txt ]; then
            echo "No diff to review"
            exit 0
          fi
          
          # Truncate diff to ~100KB
          head -c 100000 diff.txt > diff_truncated.txt
          if [ $(wc -c < diff.txt) -gt 100000 ]; then
            echo -e "\n\n[Diff truncated due to size]" >> diff_truncated.txt
          fi
          
          # Create prompt (escape for JSON)
          PROMPT=$(cat << 'EOF'
          You are an expert Java/Spring Boot code reviewer. Review the following pull request diff and provide constructive feedback. 
          Focus on bugs, security issues, performance, readability and best practices. Be concise and actionable.
          Return your review in markdown.
          
          EOF
          )
          
          # Combine prompt and diff
          {
            echo "$PROMPT"
            cat diff_truncated.txt
          } > full_prompt.txt
          
          # Create JSON payload
          jq -n --rawfile text full_prompt.txt '{contents:[{parts:[{text:$text}]}]}' > payload.json
          
          # Call Gemini API with timeout
          curl -s --max-time 60 -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json > response.json
          
          # Check if we got a valid response
          if ! jq -e '.candidates[0].content.parts[0].text' response.json > /dev/null 2>&1; then
            echo "API call failed or returned unexpected response:"
            cat response.json
            exit 1
          fi
          
          REVIEW=$(jq -r '.candidates[0].content.parts[0].text' response.json)
          
          # Post comment to PR
          jq -n --arg body "## AI Code Review (Gemini 2.5 Flash)

          $REVIEW" \
            '{body: $body}' > comment.json
          
          curl -s --max-time 30 -X POST \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d @comment.json
