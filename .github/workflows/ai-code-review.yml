name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          echo "diff_size=$(wc -c < diff.txt)" >> $GITHUB_OUTPUT

      - name: Review with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('diff.txt', 'utf8');
            
            if (diff.length === 0) {
              console.log('No diff to review');
              return;
            }
            
            // Truncate to avoid huge prompts
            const truncatedDiff = diff.length > 100000 ? diff.slice(0, 100000) + '\n\n[Diff truncated due to size]' : diff;
            
            const prompt = `You are an expert Java/Spring Boot code reviewer. Review the following pull request diff and provide constructive feedback. 
            Focus on bugs, security issues, performance, readability and best practices. Be concise and actionable.
            Return your review in markdown.\n\n${truncatedDiff}`;
            
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });
            
            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Gemini API error: ${res.status} ${err}`);
            }
            
            const data = await res.json();
            const review = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No review generated.';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## AI Code Review (Gemini 2.0 Flash)\n\n${review}`
            });
