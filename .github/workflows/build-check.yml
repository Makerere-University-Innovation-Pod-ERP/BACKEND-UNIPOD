name: Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unipod_factfinding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/unipod_factfinding_test
      DB_USER: postgres
      DATABASE_PASSWORD: postgres

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
        working-directory: UnipodERPBackend

      - name: Compile project
        run: ./mvnw -B clean test-compile
        working-directory: UnipodERPBackend

      - name: Run tests
        run: ./mvnw -B test
        working-directory: UnipodERPBackend
