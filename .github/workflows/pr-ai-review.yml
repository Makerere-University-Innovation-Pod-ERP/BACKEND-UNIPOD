name: PR AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test PR review comment generation
        run: python .github/scripts/test_pr_ai_review.py

      - name: Install OpenAPI validation tools
        run: pip install --disable-pip-version-check pyyaml openapi-spec-validator

      - name: Validate OpenAPI contract
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/pr_ai_review.py --validate-openapi

      - name: Review with Gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/pr_ai_review.py --provider gemini --base-ref "$BASE_REF"

      - name: Review with Groq
        continue-on-error: true
        env:
          PRODUCTION_TESTER: ${{ secrets.PRODUCTION_TESTER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/pr_ai_review.py --provider groq --base-ref "$BASE_REF"

      - name: Review with PR Agent
        uses: The-PR-Agent/pr-agent@v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: gemini/gemini-2.5-flash
          config.fallback_models: "[]"
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

      - name: Enforce review result
        run: python .github/scripts/pr_ai_review.py --summary
