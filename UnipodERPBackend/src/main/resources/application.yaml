spring:
  application:
    name: UnipodERPBackend

  # Database Configuration (PostgreSQL)
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${DB_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  mvc:
    async:
      request-timeout: ${ASYNC_REQUEST_TIMEOUT:PT5M}
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false

  servlet:
    multipart:
      max-file-size: ${S3_MAX_FILE_BYTES:15728640}
      max-request-size: ${S3_MAX_REQUEST_BYTES:16777216}

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Flyway Database Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api
  error:
    include-exception: false
    include-message: never

jwt:
  issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}
  audience: ${JWT_AUDIENCE:unipod-erp-api}
  secret: ${JWT_SECRET:}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  roles-claim: ${JWT_ROLES_CLAIM:roles}
  subject-claim: ${JWT_SUBJECT_CLAIM:sub}

auth:
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

# Public links (password setup, submitter portal)
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}

# CORS Configuration (Allowing your frontend app origins)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

notifications:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${NOTIFICATION_EMAIL_FROM:}
  reception:
    email: ${NOTIFICATIONS_RECEPTION_EMAIL:}
  outbox:
    poll-interval: ${NOTIFICATION_OUTBOX_POLL_INTERVAL:PT15S}

storage:
  s3:
    enabled: ${S3_STORAGE_ENABLED:false}
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    max-file-size: ${S3_MAX_FILE_BYTES:15728640}

# Spring Boot Actuator (Health and monitoring endpoints)
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

# Logging Configuration
logging:
  level:
    root: INFO
    org.unipod.unipoderpbackend: INFO
    org.springframework.flyway: INFO