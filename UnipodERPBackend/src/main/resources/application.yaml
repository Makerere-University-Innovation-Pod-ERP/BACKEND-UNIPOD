spring:
  application:
    name: UnipodERPBackend

  # Database Configuration (PostgreSQL)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/makerere_hub_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  # Flyway Database Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-exception: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  servlet:
    context-path: /api

jwt:
  issuer-uri: ${JWT_ISSUER_URI:}
  audience: ${JWT_AUDIENCE:}
  roles-claim: ${JWT_ROLES_CLAIM:roles}
  subject-claim: ${JWT_SUBJECT_CLAIM:sub}

# CORS Configuration (Allowing your frontend app origins)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Spring Boot Actuator (Health and monitoring endpoints)
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Logging Configuration
logging:
  level:
    root: INFO
    org.unipod.unipoderpbackend: INFO
    org.springframework.flyway: INFO