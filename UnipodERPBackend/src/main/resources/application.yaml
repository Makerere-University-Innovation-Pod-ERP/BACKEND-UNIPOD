spring:
  application:
    name: UnipodERPBackend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database Configuration (PostgreSQL)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/makerere_hub_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway Database Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# JWT Security Settings
jwt:
  secret: ${JWT_SECRET:change-this-to-a-very-secure-random-secret-key-for-production-environment}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}

# CORS Configuration (Allowing your frontend app origins)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Spring Boot Actuator (Health and monitoring endpoints)
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Logging Configuration
logging:
  level:
    root: INFO
    # Change package name to match your actual Java base package when you create it
    com.makerere.hub: DEBUG
    org.springframework.security: DEBUG
    org.springframework.flyway: INFO