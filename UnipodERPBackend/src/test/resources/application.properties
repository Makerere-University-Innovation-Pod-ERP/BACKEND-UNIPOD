# Local defaults so tests can be launched from an IDE without shell environment variables.
# Actual environment variables still take precedence (CI, Maven runs, IntelliJ run configurations).
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:55432/unipod_factfinding_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
